                      f"\nSHORT SCENE {i}/5"
                  )

                  image = (
                      SHORT_DIR /
                      f"visual_{i:02d}.jpg"
                  )

                  audio = (
                      SHORT_DIR /
                      f"audio_{i:02d}.mp3"
                  )

