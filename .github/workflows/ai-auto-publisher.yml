name: TechMind AI Creator - Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            edge-tts \
            feedparser \
            requests \
            pillow

      - name: Create creator.py
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import math
          import random
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          import requests
          import feedparser
          from PIL import Image, ImageDraw, ImageFont

          from google import genai
          from google.genai import types

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials


          # ============================================================
          # CONFIG
          # ============================================================

          ROOT = Path("production")
          LONG_DIR = ROOT / "long"
          SHORT_DIR = ROOT / "short"
          AUDIO_DIR = ROOT / "audio"
          THUMB_DIR = ROOT / "thumbnail"

          for d in [LONG_DIR, SHORT_DIR, AUDIO_DIR, THUMB_DIR]:
              d.mkdir(parents=True, exist_ok=True)

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]

          TEXT_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-2.5-flash",
          ]

          IMAGE_MODELS = [
              "gemini-3.1-flash-lite-image",
              "gemini-3.1-flash-image",
          ]

          VOICE = "en-US-GuyNeural"

          # Number of visual scenes.
          LONG_SCENES = 10
          SHORT_SCENES = 5

          # ============================================================
          # HELPERS
          # ============================================================

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(r"^```(?:json)?", "", text)
                  text = re.sub(r"```$", "", text)
                  text = text.strip()

              start = text.find("{")
              end = text.rfind("}")

              if start >= 0 and end >= 0:
                  return text[start:end + 1]

              raise ValueError("No JSON object found.")

          def safe_filename(text):
              text = re.sub(r"[^a-zA-Z0-9_-]+", "_", text)
              return text[:80].strip("_")

          def run_cmd(cmd, check=True):
              print("RUN:", " ".join(map(str, cmd)))

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(result.stdout[-6000:])

              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {result.returncode}"
                  )

              return result


          # ============================================================
          # FRESH AI TOPIC
          # ============================================================

          def get_fresh_topics():
              feeds = [
                  "https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=generative+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=OpenAI+Google+Gemini+AI&hl=en-US&gl=US&ceid=US:en",
              ]

              topics = []

              for url in feeds:
                  try:
                      feed = feedparser.parse(url)

                      for entry in feed.entries[:10]:
                          title = getattr(entry, "title", "")
                          summary = getattr(entry, "summary", "")

                          if title:
                              topics.append({
                                  "title": title,
                                  "summary": re.sub(
                                      "<[^>]+>",
                                      "",
                                      summary
                                  )[:1000]
                              })

                  except Exception as e:
                      print("RSS error:", e)

              # Remove duplicates
              unique = []
              seen = set()

              for item in topics:
                  key = item["title"].lower().strip()

                  if key not in seen:
                      seen.add(key)
                      unique.append(item)

              return unique[:25]


          # ============================================================
          # GEMINI TEXT
          # ============================================================

          def gemini_text(prompt):
              client = genai.Client(api_key=GEMINI_KEY)

              last_error = None

              for model in TEXT_MODELS:

                  for attempt in range(1, 7):

                      print(
                          f"TEXT MODEL={model} "
                          f"ATTEMPT={attempt}/6"
                      )

                      try:
                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  temperature=0.8,
                                  max_output_tokens=12000,
                              )
                          )

                          text = response.text

                          if text and len(text.strip()) > 100:
                              print(
                                  f"TEXT SUCCESS: {model}"
                              )
                              return text

                          raise RuntimeError(
                              "Empty Gemini response."
                          )

                      except Exception as e:
                          last_error = e

                          print(
                              "TEXT ERROR:",
                              type(e).__name__,
                              str(e)[:500]
                          )

                          error = str(e).lower()

                          retryable = any(
                              x in error
                              for x in [
                                  "429",
                                  "500",
                                  "502",
                                  "503",
                                  "504",
                                  "timeout",
                                  "timed out",
                                  "unavailable",
                                  "resource_exhausted",
                                  "deadline_exceeded"
                              ]
                          )

                          if retryable:
                              wait = min(
                                  60,
                                  5 * (2 ** (attempt - 1))
                              )

                              print(
                                  f"Waiting {wait}s..."
                              )

                              time.sleep(wait)

                              continue

                          break

                  print(
                      f"Model {model} exhausted. "
                      "Trying next model."
                  )

              raise RuntimeError(
                  f"Gemini text generation failed: "
                  f"{last_error}"
              )


          # ============================================================
          # IMAGE GENERATION
          # ============================================================

          def generate_image(prompt, output_path, aspect_ratio="16:9"):

              output_path = Path(output_path)
              output_path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              client = genai.Client(
                  api_key=GEMINI_KEY
              )

              last_error = None

              for model in IMAGE_MODELS:

                  for attempt in range(1, 7):

                      print(
                          f"IMAGE MODEL={model} "
                          f"FILE={output_path} "
                          f"ATTEMPT={attempt}/6"
                      )

                      try:

                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  response_modalities=["IMAGE"],
                                  image_config=types.ImageConfig(
                                      aspect_ratio=aspect_ratio,
                                      image_size="1K",
                                  ),
                              )
                          )

                          found = False

                          for part in response.parts:

                              if getattr(
                                  part,
                                  "inline_data",
                                  None
                              ):

                                  image = part.as_image()

                                  image.save(
                                      str(output_path)
                                  )

                                  found = True
                                  break

                          if found and output_path.exists():

                              size = output_path.stat().st_size

                              if size > 5000:

                                  print(
                                      f"IMAGE OK: "
                                      f"{output_path} "
                                      f"({size} bytes)"
                                  )

                                  return True

                          raise RuntimeError(
                              "No usable image returned."
                          )

                      except Exception as e:

                          last_error = e

                          error = str(e)

                          print(
                              "IMAGE ERROR:",
                              type(e).__name__,
                              error[:500]
                          )

                          retryable = any(
                              x.lower() in error.lower()
                              for x in [
                                  "429",
                                  "resource_exhausted",
                                  "503",
                                  "500",
                                  "502",
                                  "504",
                                  "timeout",
                                  "timed out",
                                  "unavailable",
                                  "deadline_exceeded"
                              ]
                          )

                          if retryable:

                              # Longer backoff for image quota.
                              wait = min(
                                  120,
                                  10 * (2 ** (attempt - 1))
                              )

                              print(
                                  f"Temporary image API "
                                  f"problem. Waiting "
                                  f"{wait}s..."
                              )

                              time.sleep(wait)

                              continue

                          print(
                              "Non-retryable image error. "
                              "Trying next model."
                          )

                          break

                  print(
                      f"Image model {model} exhausted."
                  )

              raise RuntimeError(
                  f"Image generation failed: "
                  f"{output_path}. "
                  f"Last error: {last_error}"
              )


          # ============================================================
          # FALLBACK VISUAL
          # ============================================================

          def create_fallback_image(
              text,
              output_path,
              width=1280,
              height=720
          ):

              print(
                  "Creating fallback visual:",
                  output_path
              )

              img = Image.new(
                  "RGB",
                  (width, height),
                  (12, 16, 24)
              )

              draw = ImageDraw.Draw(img)

              try:
                  font_big = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf",
                      64
                  )

                  font_small = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans.ttf",
                      30
                  )

              except Exception:
                  font_big = None
                  font_small = None

              words = text.split()
              lines = []
              line = ""

              for word in words:

                  test = (line + " " + word).strip()

                  if len(test) > 25:
                      lines.append(line)
                      line = word
                  else:
                      line = test

              if line:
                  lines.append(line)

              y = height // 2 - len(lines) * 40

              for line in lines:
                  box = draw.textbbox(
                      (0, 0),
                      line,
                      font=font_big
                  )

                  w = box[2] - box[0]

                  draw.text(
                      ((width - w) / 2, y),
                      line,
                      fill="white",
                      font=font_big
                  )

                  y += 85

              draw.text(
                  (50, height - 60),
                  "TECHMIND AI",
                  fill="white",
                  font=font_small
              )

              img.save(output_path, quality=95)


          # ============================================================
          # TTS
          # ============================================================

          def make_tts(text, output_path):

              output_path = Path(output_path)

              run_cmd([
                  "edge-tts",
                  "--voice",
                  VOICE,
                  "--rate=-5%",
                  "--text",
                  text,
                  "--write-media",
                  str(output_path)
              ])

              if not output_path.exists():
                  raise RuntimeError(
                      "TTS audio was not created."
                  )


          # ============================================================
          # SRT
          # ============================================================

          def srt_time(seconds):

              seconds = max(0, float(seconds))

              hours = int(seconds // 3600)

              minutes = int(
                  (seconds % 3600) // 60
              )

              secs = int(seconds % 60)

              millis = int(
                  round((seconds - int(seconds)) * 1000)
              )

              if millis >= 1000:
                  secs += 1
                  millis = 0

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{millis:03d}"
              )


          def create_srt(script, duration, output):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  script.strip()
              )

              sentences = [
                  s.strip()
                  for s in sentences
                  if s.strip()
              ]

              if not sentences:
                  return

              total_words = sum(
                  len(x.split())
                  for x in sentences
              )

              current = 0.0
              rows = []

              for i, sentence in enumerate(sentences):

                  words = len(sentence.split())

                  part = (
                      duration * words /
                      max(total_words, 1)
                  )

                  start = current
                  end = min(
                      duration,
                      current + part
                  )

                  rows.append(
                      f"{i + 1}\n"
                      f"{srt_time(start)} --> "
                      f"{srt_time(end)}\n"
                      f"{sentence}\n"
                  )

                  current = end

              Path(output).write_text(
                  "\n".join(rows),
                  encoding="utf-8"
              )


          # ============================================================
          # VIDEO SCENE
          # ============================================================

          def create_scene_video(
              image,
              audio,
              output,
              duration,
              index
          ):

              frames = max(
                  1,
                  int(duration * 30)
              )

              # Gentle animated zoom.
              zoom = (
                  "zoompan="
                  "z='min(zoom+0.0008,1.12)':"
                  "x='iw/2-(iw/zoom/2)':"
                  "y='ih/2-(ih/zoom/2)':"
                  f"d={frames}:"
                  "s=1280x720:"
                  "fps=30"
              )

              run_cmd([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-i",
                  str(audio),
                  "-vf",
                  zoom,
                  "-t",
                  str(duration),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  str(output)
              ])


          # ============================================================
          # CONCAT
          # ============================================================

          def concat_videos(files, output):

              concat_file = ROOT / "concat.txt"

              with open(
                  concat_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for file in files:
                      absolute = Path(file).resolve()

                      f.write(
                          "file '"
                          + str(absolute)
                              .replace("'", "'\\''")
                          + "'\n"
                      )

              run_cmd([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-c",
                  "copy",
                  str(output)
              ])


          # ============================================================
          # GET MEDIA DURATION
          # ============================================================

          def media_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True
              )

              return float(
                  result.stdout.strip()
              )


          # ============================================================
          # FINAL LONG VIDEO
          # ============================================================

          def build_long_video(package):

              print("Building long-form video...")

              scenes = package["long_video"]["scenes"]

              scene_files = []

              total_scene_duration = (
                  4.8 * 60 / max(len(scenes), 1)
              )

              for i, scene in enumerate(scenes):

                  index = i + 1

                  image_path = (
                      LONG_DIR /
                      f"scene_{index:02d}.jpg"
                  )

                  audio_path = (
                      AUDIO_DIR /
                      f"scene_{index:02d}.mp3"
                  )

                  video_path = (
                      LONG_DIR /
                      f"scene_{index:02d}.mp4"
                  )

                  prompt = scene["visual_prompt"]

                  # Force clean visual style.
                  prompt += (
                      "\n\nCreate a cinematic professional "
                      "technology-news visual. "
                      "No readable paragraphs. "
                      "No watermark. "
                      "No fake UI screenshots. "
                      "No random people. "
                      "High contrast. "
                      "Realistic lighting. "
                      "16:9 composition."
                  )

                  try:

                      generate_image(
                          prompt,
                          image_path,
                          "16:9"
                      )

                  except Exception as e:

                      print(
                          "Image generation failed, "
                          "using fallback visual:",
                          e
                      )

                      create_fallback_image(
                          scene["on_screen_text"],
                          image_path
                      )

                  make_tts(
                      scene["voiceover"],
                      audio_path
                  )

                  actual_duration = media_duration(
                      audio_path
                  )

                  create_scene_video(
                      image_path,
                      audio_path,
                      video_path,
                      actual_duration,
                      index
                  )

                  scene_files.append(
                      video_path
                  )

              raw_output = (
                  ROOT /
                  "long_raw.mp4"
              )

              concat_videos(
                  scene_files,
                  raw_output
              )

              final_output = (
                  ROOT /
                  "TechMind_AI_Latest.mp4"
              )

              run_cmd([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw_output),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "21",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(final_output)
              ])

              return final_output


          # ============================================================
          # SHORT
          # ============================================================

          def build_short(package):

              print("Building Short...")

              scenes = package["short"]["scenes"]

              image_path = (
                  SHORT_DIR /
                  "short_visual.jpg"
              )

              first_prompt = scenes[0]["visual_prompt"]

              try:

                  generate_image(
                      first_prompt +
                      "\nVertical social media composition. "
                      "Strong visual center. "
                      "No watermark.",
                      image_path,
                      "9:16"
                  )

              except Exception:

                  create_fallback_image(
                      package["short"]["hook"],
                      image_path,
                      720,
                      1280
                  )

              audio_path = (
                  AUDIO_DIR /
                  "short.mp3"
              )

              script = " ".join(
                  x["voiceover"]
                  for x in scenes
              )

              make_tts(
                  script,
                  audio_path
              )

              duration = media_duration(
                  audio_path
              )

              short_output = (
                  ROOT /
                  "TechMind_AI_Short.mp4"
              )

              frames = max(
                  1,
                  int(duration * 30)
              )

              vf = (
                  "scale=720:1280:"
                  "force_original_aspect_ratio=decrease,"
                  "pad=720:1280:(ow-iw)/2:(oh-ih)/2,"
                  "zoompan="
                  "z='min(zoom+0.001,1.10)':"
                  "d=" + str(frames) +
                  ":s=720x1280:fps=30"
              )

              run_cmd([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image_path),
                  "-i",
                  str(audio_path),
                  "-vf",
                  vf,
                  "-t",
                  str(duration),
                  "-c:v",
                  "libx264",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  str(short_output)
              ])

              return short_output


          # ============================================================
          # THUMBNAIL
          # ============================================================

          def build_thumbnail(package):

              title = package["title"]

              source = (
                  LONG_DIR /
                  "scene_01.jpg"
              )

              output = (
                  THUMB_DIR /
                  "thumbnail.jpg"
              )

              if source.exists():

                  img = Image.open(source).convert("RGB")
                  img = img.resize((1280, 720))

              else:

                  img = Image.new(
                      "RGB",
                      (1280, 720),
                      (10, 15, 25)
                  )

              draw = ImageDraw.Draw(img)

              try:

                  font = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf",
                      62
                  )

              except Exception:

                  font = None

              # Short title for thumbnail.
              thumb_text = title

              if len(thumb_text) > 48:
                  thumb_text = (
                      thumb_text[:45] + "..."
                  )

              # Dark overlay.
              overlay = Image.new(
                  "RGBA",
                  img.size,
                  (0, 0, 0, 100)
              )

              img = Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")

              draw = ImageDraw.Draw(img)

              box = draw.multiline_textbbox(
                  (0, 0),
                  thumb_text,
                  font=font,
                  spacing=10
              )

              w = box[2] - box[0]
              h = box[3] - box[1]

              x = (1280 - w) / 2
              y = (720 - h) / 2

              draw.multiline_text(
                  (x, y),
                  thumb_text,
                  font=font,
                  fill="white",
                  stroke_width=3,
                  stroke_fill="black",
                  align="center"
              )

              draw.text(
                  (45, 650),
                  "TECHMIND AI",
                  font=font,
                  fill="white"
              )

              img.save(
                  output,
                  quality=95
              )

              return output


          # ============================================================
          # YOUTUBE
          # ============================================================

          def youtube_client():

              token = os.environ[
                  "YOUTUBE_TOKEN_JSON"
              ]

              info = json.loads(token)

              credentials = Credentials.from_authorized_user_info(
                  info,
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          def upload_video(
              youtube,
              video_path,
              title,
              description,
              tags,
              thumbnail=None
          ):

              print(
                  "Uploading:",
                  video_path
              )

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": tags[:30],
                      "categoryId": "28",
                      "defaultLanguage": "en"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(video_path),
                  chunksize=8 * 1024 * 1024,
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None

              while response is None:

                  status, response = request.next_chunk()

                  if status:
                      print(
                          f"Upload progress: "
                          f"{int(status.progress() * 100)}%"
                      )

              video_id = response["id"]

              print(
                  "YOUTUBE UPLOAD SUCCESS:",
                  video_id
              )

              if thumbnail and Path(
                  thumbnail
              ).exists():

                  try:

                      youtube.thumbnails().set(
                          videoId=video_id,
                          media_body=MediaFileUpload(
                              str(thumbnail),
                              mimetype="image/jpeg"
                          )
                      ).execute()

                      print(
                          "Thumbnail uploaded."
                      )

                  except Exception as e:

                      print(
                          "Thumbnail upload warning:",
                          e
                      )

              return video_id


          # ============================================================
          # MAIN AI CONTENT GENERATION
          # ============================================================

          def generate_package():

              topics = get_fresh_topics()

              topic_text = "\n".join(
                  f"- {x['title']}: "
                  f"{x['summary']}"
                  for x in topics
              )

              prompt = f"""
          You are the senior producer for a professional AI/technology
          YouTube channel called TechMind AI.

          Today's fresh AI news/topics:

          {topic_text}

          Choose ONE topic that has:
          - strong viewer interest
          - current relevance
          - useful educational value
          - potential for YouTube search/discovery
          - enough substance for a 4-5 minute original video

          Do NOT simply copy the news article.
          Create an original explanatory video.

          Return ONLY valid JSON.

          Required JSON:

          {{
            "topic": "...",
            "title": "... relevant emoji ...",
            "description": "...",
            "hashtags": ["#AI", "#..."],
            "tags": ["AI", "..."],
            "hook": "...",
            "long_video": {{
              "script": "...",
              "scenes": [
                {{
                  "visual_prompt": "...",
                  "voiceover": "...",
                  "on_screen_text": "..."
                }}
              ]
            }},
            "short": {{
              "title": "... emoji ...",
              "hook": "...",
              "scenes": [
                {{
                  "visual_prompt": "...",
                  "voiceover": "..."
                }}
              ]
            }}
          }}

          Rules:

          LONG VIDEO:
          - 4 to 5 minutes.
          - 10 scenes.
          - Every scene must have a DIFFERENT visual concept.
          - Strong first 10 seconds.
          - Natural spoken English.
          - Explain the topic clearly.
          - No boring filler.
          - No copied article language.
          - Add useful examples.
          - End with a strong takeaway and subscribe CTA.

          TITLE:
          - compelling but not fake clickbait
          - maximum 90 characters
          - include 1 or 2 relevant emojis

          DESCRIPTION:
          - 2-4 useful paragraphs
          - include relevant keywords naturally
          - include the generated hashtags at the end

          HASHTAGS:
          - 5 to 8 relevant hashtags.

          TAGS:
          - 10 to 20 relevant YouTube tags.

          VISUAL PROMPTS:
          - cinematic technology journalism
          - realistic
          - professional
          - different composition every scene
          - no watermark
          - no giant paragraphs
          - no copyrighted logos unless genuinely relevant
          - no fake quotations

          SHORT:
          - 35-55 seconds
          - 5 scenes
          - extremely strong hook
          - vertical-video friendly
          """

              raw = gemini_text(prompt)

              package = json.loads(
                  clean_json(raw)
              )

              # Basic validation.
              required = [
                  "topic",
                  "title",
                  "description",
                  "hashtags",
                  "tags",
                  "long_video",
                  "short"
              ]

              for key in required:

                  if key not in package:
                      raise RuntimeError(
                          f"Missing JSON field: {key}"
                      )

              if len(
                  package["long_video"]["scenes"]
              ) < 8:

                  raise RuntimeError(
                      "Too few long-video scenes."
                  )

              if len(
                  package["short"]["scenes"]
              ) < 4:

                  raise RuntimeError(
                      "Too few Short scenes."
                  )

              # Ensure hashtags exist in description.
              hashtag_text = " ".join(
                  package["hashtags"]
              )

              if hashtag_text not in package[
                  "description"
              ]:

                  package["description"] += (
                      "\n\n" + hashtag_text
                  )

              return package


          # ============================================================
          # QUALITY CHECKS
          # ============================================================

          def quality_check(package, long_video, short_video):

              print("\n========== QUALITY CHECK ==========")

              errors = []

              if not long_video.exists():
                  errors.append(
                      "Long video missing"
                  )

              if not short_video.exists():
                  errors.append(
                      "Short missing"
                  )

              if len(package["title"]) > 100:
                  errors.append(
                      "Title too long"
                  )

              if len(
                  package["description"]
              ) < 100:

                  errors.append(
                      "Description too short"
                  )

              long_duration = media_duration(
                  long_video
              )

              short_duration = media_duration(
                  short_video
              )

              print(
                  f"Long duration: "
                  f"{long_duration:.1f}s"
              )

              print(
                  f"Short duration: "
                  f"{short_duration:.1f}s"
              )

              if long_duration < 180:
                  errors.append(
                      "Long video shorter than 3 minutes"
                  )

              if short_duration < 20:
                  errors.append(
                      "Short is too short"
                  )

              if errors:

                  print(
                      "QUALITY WARNINGS:",
                      errors
                  )

              else:

                  print(
                      "QUALITY CHECK PASSED"
                  )

              # Don't fail because an optional
              # quality metric is imperfect.
              return len(errors) == 0


          # ============================================================
          # SAVE METADATA
          # ============================================================

          def save_metadata(package):

              metadata = {
                  **package,
                  "generated_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }

              path = ROOT / "metadata.json"

              path.write_text(
                  json.dumps(
                      metadata,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              return path


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "\n===================================="
              )

              print(
                  "TECHMIND AI PRODUCTION START"
              )

              print(
                  "====================================\n"
              )

              package = generate_package()

              print(
                  "TOPIC:",
                  package["topic"]
              )

              print(
                  "TITLE:",
                  package["title"]
              )

              print(
                  "HASHTAGS:",
                  package["hashtags"]
              )

              print(
                  "TAGS:",
                  package["tags"]
              )

              metadata = save_metadata(
                  package
              )

              long_video = build_long_video(
                  package
              )

              short_video = build_short(
                  package
              )

              thumbnail = build_thumbnail(
                  package
              )

              quality_check(
                  package,
                  long_video,
                  short_video
              )

              youtube = youtube_client()

              long_description = (
                  package["description"]
                  + "\n\n"
                  + "Watch the full video for "
                    "the complete explanation."
              )

              long_tags = package["tags"]

              long_id = upload_video(
                  youtube,
                  long_video,
                  package["title"],
                  long_description,
                  long_tags,
                  thumbnail
              )

              short_id = upload_video(
                  youtube,
                  short_video,
                  package["short"]["title"],
                  package["description"],
                  package["tags"],
                  None
              )

              print("\n====================================")
              print("PRODUCTION COMPLETE")
              print("====================================")
              print("LONG VIDEO:", long_id)
              print("SHORT:", short_id)
              print("METADATA:", metadata)
              print("====================================")


          if __name__ == "__main__":
              main()

