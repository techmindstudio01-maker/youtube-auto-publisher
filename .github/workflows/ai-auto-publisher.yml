name: TechMind Studio - Real Motion AI Creator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth edge-tts requests pillow

      - name: Create production engine
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import math
          import random
          import asyncio
          import subprocess
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance
          from google import genai
          import edge_tts

          # ============================================================
          # CONFIG
          # ============================================================

          BRAND = "TECHMIND STUDIO"

          ROOT = Path("production")
          LONG = ROOT / "long"
          SHORT = ROOT / "short"
          AUDIO = ROOT / "audio"

          for d in [LONG, SHORT, AUDIO]:
              d.mkdir(parents=True, exist_ok=True)

          LW, LH = 1920, 1080
          SW, SH = 1080, 1920
          FPS = 30

          USED_IMAGES = set()
          IMAGE_SOURCES = []

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          MODEL = "gemini-3.5-flash-lite"

          # ============================================================
          # COMMAND
          # ============================================================

          def run(cmd):
              print("\nRUN:", " ".join(map(str, cmd)))

              p = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(p.stdout)

              if p.returncode != 0:
                  raise RuntimeError(
                      "Command failed"
                  )

          # ============================================================
          # GEMINI
          # ============================================================

          def ask(prompt):

              last = None

              for attempt in range(6):

                  try:
                      print(
                          f"GEMINI {attempt + 1}/6"
                      )

                      r = client.models.generate_content(
                          model=MODEL,
                          contents=prompt
                      )

                      if r.text:
                          return r.text.strip()

                  except Exception as e:
                      last = e
                      print(e)

              raise RuntimeError(
                  f"Gemini failed: {last}"
              )

          def json_clean(x):

              x = x.strip()

              x = re.sub(
                  r"```json",
                  "",
                  x,
                  flags=re.I
              )

              x = x.replace("```", "")

              a = x.find("{")
              b = x.rfind("}")

              return json.loads(
                  x[a:b + 1]
              )

          # ============================================================
          # CONTENT
          # ============================================================

          def create_content():

              prompt = """
              Create a professional YouTube video package for
              TECHMIND STUDIO.

              Topic must be fresh, interesting and AI/technology focused.

              The long video must be 4.5 to 5 minutes.

              Write 700-850 words.

              The first 10 seconds must have a very strong hook.

              The narration must sound natural when spoken by an AI voice.

              IMPORTANT VISUAL DIRECTION:

              The video will use realistic full-screen photographic
              visuals with cinematic motion.

              Visuals should be suitable for:
              - AI data centers
              - robots
              - AI chips
              - computers
              - people using technology
              - futuristic laboratories
              - servers
              - smartphones
              - software development
              - real technology products

              Give 10 DIFFERENT visual concepts.

              Each visual concept must be specific enough to find a
              realistic HD photograph.

              Also give a motion_type for every scene.

              Allowed motion types:

              push_in
              pull_out
              track_left
              track_right
              rise
              descend
              parallax
              orbit
              focus

              Return ONLY JSON:

              {
                "topic": "",
                "title": "",
                "description": "",
                "hashtags": [],
                "tags": [],
                "script": "",
                "short_script": "",
                "scenes": [
                  {
                    "visual": "",
                    "motion_type": "push_in"
                  }
                ]
              }

              Exactly 10 scenes.

              Short script should be approximately 50 seconds.
              """

              return json_clean(
                  ask(prompt)
              )

          # ============================================================
          # IMAGE SEARCH
          # ============================================================

          def find_image(query, output):

              print(
                  "\nSEARCH REAL VISUAL:",
                  query
              )

              api = (
                  "https://commons.wikimedia.org/"
                  "w/api.php"
              )

              params = {
                  "action": "query",
                  "generator": "search",
                  "gsrsearch": query,
                  "gsrnamespace": 6,
                  "gsrlimit": 20,
                  "prop": "imageinfo",
                  "iiprop": "url|size",
                  "iiurlwidth": 2600,
                  "format": "json"
              }

              try:

                  r = requests.get(
                      api,
                      params=params,
                      timeout=30,
                      headers={
                          "User-Agent":
                          "TechMindStudio/1.0"
                      }
                  )

                  data = r.json()

                  pages = data.get(
                      "query",
                      {}
                  ).get(
                      "pages",
                      {}
                  )

                  candidates = []

                  for page in pages.values():

                      infos = page.get(
                          "imageinfo",
                          []
                      )

                      if not infos:
                          continue

                      info = infos[0]

                      url = (
                          info.get("thumburl")
                          or info.get("url")
                      )

                      w = info.get(
                          "width",
                          0
                      )

                      h = info.get(
                          "height",
                          0
                      )

                      if not url:
                          continue

                      if url in USED_IMAGES:
                          continue

                      if w < 1400 or h < 800:
                          continue

                      candidates.append(
                          (
                              url,
                              w,
                              h,
                              page.get(
                                  "title",
                                  ""
                              )
                          )
                      )

                  if not candidates:
                      return False

                  # Highest quality first
                  candidates.sort(
                      key=lambda x:
                      x[1] * x[2],
                      reverse=True
                  )

                  url, w, h, title = (
                      candidates[0]
                  )

                  img = requests.get(
                      url,
                      timeout=60,
                      headers={
                          "User-Agent":
                          "TechMindStudio/1.0"
                      }
                  )

                  img.raise_for_status()

                  output.write_bytes(
                      img.content
                  )

                  USED_IMAGES.add(url)

                  IMAGE_SOURCES.append({
                      "title": title,
                      "url": url
                  })

                  print(
                      "REAL HD IMAGE:",
                      w,
                      "x",
                      h
                  )

                  return True

              except Exception as e:
                  print(
                      "IMAGE ERROR:",
                      e
                  )

                  return False

          # ============================================================
          # FALLBACK
          # ============================================================

          def fallback(path):

              img = Image.new(
                  "RGB",
                  (1920, 1080),
                  (7, 12, 22)
              )

              draw = ImageDraw.Draw(img)

              # soft futuristic background
              for i in range(15):

                  x = random.randint(
                      0,
                      1920
                  )

                  y = random.randint(
                      0,
                      1080
                  )

                  r = random.randint(
                      100,
                      500
                  )

                  draw.ellipse(
                      (
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ),
                      fill=(
                          random.randint(
                              8,
                              25
                          ),
                          random.randint(
                              15,
                              40
                          ),
                          random.randint(
                              35,
                              80
                          )
                      )
                  )

              img = img.filter(
                  ImageFilter.GaussianBlur(50)
              )

              img.save(
                  path,
                  quality=96
              )

          # ============================================================
          # COVER IMAGE
          # ============================================================

          def cover(path, width, height):

              img = Image.open(
                  path
              ).convert("RGB")

              ratio = width / height
              sr = img.width / img.height

              if sr > ratio:

                  nw = int(
                      img.height * ratio
                  )

                  left = (
                      img.width - nw
                  ) // 2

                  img = img.crop(
                      (
                          left,
                          0,
                          left + nw,
                          img.height
                      )
                  )

              else:

                  nh = int(
                      img.width / ratio
                  )

                  top = (
                      img.height - nh
                  ) // 2

                  img = img.crop(
                      (
                          0,
                          top,
                          img.width,
                          top + nh
                      )
                  )

              return img.resize(
                  (
                      width,
                      height
                  ),
                  Image.Resampling.LANCZOS
              )

          # ============================================================
          # BRAND ONLY
          # ============================================================

          def add_brand(img):

              draw = ImageDraw.Draw(
                  img,
                  "RGBA"
              )

              font_path = (
                  "/usr/share/fonts/"
                  "truetype/liberation2/"
                  "LiberationSans-Bold.ttf"
              )

              f = ImageFont.truetype(
                  font_path,
                  30
              )

              text = BRAND

              bbox = draw.textbbox(
                  (0, 0),
                  text,
                  font=f
              )

              tw = bbox[2] - bbox[0]
              th = bbox[3] - bbox[1]

              x = 40
              y = img.height - 58

              # elegant glass tag
              draw.rounded_rectangle(
                  (
                      x - 12,
                      y - 8,
                      x + tw + 18,
                      y + th + 10
                  ),
                  radius=10,
                  fill=(0, 0, 0, 115)
              )

              draw.text(
                  (x, y),
                  text,
                  font=f,
                  fill=(
                      255,
                      255,
                      255,
                      235
                  )
              )

              return img

          # ============================================================
          # PREPARE VISUAL
          # ============================================================

          def prepare_visual(
              query,
              output,
              vertical=False
          ):

              w = SW if vertical else LW
              h = SH if vertical else LH

              raw = output.with_suffix(
                  ".download.jpg"
              )

              if not find_image(
                  query,
                  raw
              ):

                  fallback(raw)

              img = cover(
                  raw,
                  w,
                  h
              )

              # Premium realistic grade
              img = ImageEnhance.Contrast(
                  img
              ).enhance(1.05)

              img = ImageEnhance.Color(
                  img
              ).enhance(1.04)

              img = ImageEnhance.Sharpness(
                  img
              ).enhance(1.12)

              img = add_brand(img)

              img.save(
                  output,
                  "JPEG",
                  quality=98,
                  subsampling=0
              )

              raw.unlink(
                  missing_ok=True
              )

          # ============================================================
          # TTS
          # ============================================================

          async def tts_async(
              text,
              output
          ):

              voice = (
                  "en-US-ChristopherNeural"
              )

              t = edge_tts.Communicate(
                  text,
                  voice,
                  rate="-5%",
                  volume="+0%"
              )

              await t.save(
                  str(output)
              )

          def make_tts(text, output):

              asyncio.run(
                  tts_async(
                      text,
                      output
                  )
              )

          # ============================================================
          # SCRIPT SPLIT
          # ============================================================

          def split_script(
              text,
              count
          ):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text.strip()
              )

              sentences = [
                  x.strip()
                  for x in sentences
                  if len(x.strip()) > 15
              ]

              if not sentences:
                  return [text]

              groups = []

              total = len(sentences)

              for i in range(count):

                  a = round(
                      i * total / count
                  )

                  b = round(
                      (i + 1) *
                      total /
                      count
                  )

                  part = " ".join(
                      sentences[a:b]
                  )

                  if part:
                      groups.append(
                          part
                      )

              while len(groups) < count:
                  groups.append(
                      groups[-1]
                  )

              return groups

          # ============================================================
          # REALISTIC MOTION ENGINE
          # ============================================================

          def animated_scene(
              image,
              audio,
              output,
              motion,
              vertical=False
          ):

              w = SW if vertical else LW
              h = SH if vertical else LH

              # --------------------------------------------------------
              # Audio duration
              # --------------------------------------------------------

              p = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(audio)
                  ],
                  stdout=subprocess.PIPE,
                  text=True
              )

              duration = float(
                  p.stdout.strip()
              )

              frames = max(
                  2,
                  int(
                      duration * FPS
                  )
              )

              # --------------------------------------------------------
              # Real camera motion
              #
              # Image is rendered at larger size.
              # Camera continuously moves through it.
              # --------------------------------------------------------

              zoom_start = 1.02
              zoom_end = 1.09

              if motion == "push_in":

                  z = (
                      f"zoom="
                      f"'{zoom_start}+"
                      f"({zoom_end-zoom_start})*"
                      f"on/{frames-1}'"
                  )

                  x = (
                      "x='iw/2-(iw/zoom/2)'"
                  )

                  y = (
                      "y='ih/2-(ih/zoom/2)'"
                  )

              elif motion == "pull_out":

                  z = (
                      f"zoom="
                      f"'{zoom_end}-"
                      f"({zoom_end-zoom_start})*"
                      f"on/{frames-1}'"
                  )

                  x = (
                      "x='iw/2-(iw/zoom/2)'"
                  )

                  y = (
                      "y='ih/2-(ih/zoom/2)'"
                  )

              elif motion == "track_left":

                  z = (
                      "zoom='1.075'"
                  )

                  x = (
                      f"x='(iw-iw/zoom)*"
                      f"(1-on/{frames-1})'"
                  )

                  y = (
                      "y='ih/2-(ih/zoom/2)'"
                  )

              elif motion == "track_right":

                  z = (
                      "zoom='1.075'"
                  )

                  x = (
                      f"x='(iw-iw/zoom)*"
                      f"on/{frames-1}"
                  )

                  y = (
                      "y='ih/2-(ih/zoom/2)'"
                  )

              elif motion == "rise":

                  z = (
                      "zoom='1.075'"
                  )

                  x = (
                      "x='iw/2-(iw/zoom/2)'"
                  )

                  y = (
                      f"y='(ih-ih/zoom)*"
                      f"(1-on/{frames-1})'"
                  )

              elif motion == "descend":

                  z = (
                      "zoom='1.075'"
                  )

                  x = (
                      "x='iw/2-(iw/zoom/2)'"
                  )

                  y = (
                      f"y='(ih-ih/zoom)*"
                      f"on/{frames-1}"
                  )

              elif motion == "parallax":

                  z = (
                      "zoom='1.085'"
                  )

                  x = (
                      f"x='(iw-iw/zoom)*"
                      f"(0.25+0.5*on/{frames-1})'"
                  )

                  y = (
                      f"y='(ih-ih/zoom)*"
                      f"(0.65-0.3*on/{frames-1})'"
                  )

              elif motion == "orbit":

                  z = (
                      "zoom='1.065'"
                  )

                  x = (
                      f"x='(iw-iw/zoom)*"
                      f"(0.5+0.18*sin("
                      f"on/{frames-1}*PI*2))'"
                  )

                  y = (
                      f"y='(ih-ih/zoom)*"
                      f"(0.5+0.12*cos("
                      f"on/{frames-1}*PI*2))'"
                  )

              else:

                  z = (
                      "zoom='1.06'"
                  )

                  x = (
                      "x='iw/2-(iw/zoom/2)'"
                  )

                  y = (
                      "y='ih/2-(ih/zoom/2)'"
                  )

              # --------------------------------------------------------
              # Cinematic motion
              # --------------------------------------------------------

              vf = (
                  "scale="
                  f"{int(w*1.12)}:"
                  f"{int(h*1.12)}:"
                  "force_original_aspect_ratio=increase,"
                  f"crop={int(w*1.12)}:{int(h*1.12)},"
                  f"zoompan="
                  f"{z}:"
                  f"{x}:"
                  f"{y}:"
                  "d=1:"
                  f"s={w}x{h}:"
                  f"fps={FPS},"
                  "format=yuv420p"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-i",
                  str(audio),
                  "-vf",
                  vf,
                  "-t",
                  f"{duration:.3f}",
                  "-r",
                  str(FPS),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "18",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])

          # ============================================================
          # SMOOTH SCENE TRANSITIONS
          # ============================================================

          def join_scenes(
              videos,
              output
          ):

              # First normalize every scene,
              # then use FFmpeg concat.
              list_file = (
                  ROOT /
                  f"{output.stem}_list.txt"
              )

              with open(
                  list_file,
                  "w"
              ) as f:

                  for video in videos:

                      f.write(
                          "file '"
                          f"{Path(video).resolve()}"
                          "'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])

          # ============================================================
          # LONG VIDEO
          # ============================================================

          def build_long(pkg):

              parts = split_script(
                  pkg["script"],
                  10
              )

              videos = []

              for i, text in enumerate(parts):

                  print(
                      f"\nLONG SCENE "
                      f"{i+1}/10"
                  )

                  scene = pkg["scenes"][
                      i
                  ]

                  image = (
                      LONG /
                      f"scene_{i+1:02d}.jpg"
                  )

                  audio = (
                      AUDIO /
                      f"long_{i+1:02d}.mp3"
                  )

                  video = (
                      LONG /
                      f"scene_{i+1:02d}.mp4"
                  )

                  prepare_visual(
                      scene["visual"],
                      image,
                      False
                  )

                  make_tts(
                      text,
                      audio
                  )

                  animated_scene(
                      image,
                      audio,
                      video,
                      scene["motion_type"],
                      False
                  )

                  videos.append(
                      video
                  )

              final = (
                  ROOT /
                  "TechMind_Studio_Long.mp4"
              )

              join_scenes(
                  videos,
                  final
              )

              return final

          # ============================================================
          # SHORT
          # ============================================================

          def build_short(pkg):

              parts = split_script(
                  pkg["short_script"],
                  5
              )

              videos = []

              for i, text in enumerate(parts):

                  print(
                      f"\nSHORT SCENE "
                      f"{i+1}/5"
                  )

                  scene = pkg["scenes"][
                      (i + 5) % 10
                  ]

                  image = (
                      SHORT /
                      f"scene_{i+1:02d}.jpg"
                  )

                  audio = (
                      AUDIO /
                      f"short_{i+1:02d}.mp3"
                  )

                  video = (
                      SHORT /
                      f"scene_{i+1:02d}.mp4"
                  )

                  prepare_visual(
                      scene["visual"],
                      image,
                      True
                  )

                  make_tts(
                      text,
                      audio
                  )

                  animated_scene(
                      image,
                      audio,
                      video,
                      scene["motion_type"],
                      True
                  )

                  videos.append(
                      video
                  )

              final = (
                  ROOT /
                  "TechMind_Studio_Short.mp4"
              )

              join_scenes(
                  videos,
                  final
              )

              return final

          # ============================================================
          # YOUTUBE
          # ============================================================

          def youtube():

              from google.oauth2.credentials import Credentials
              from googleapiclient.discovery import build

              creds = Credentials.from_authorized_user_info(
                  json.loads(
                      os.environ[
                          "YOUTUBE_TOKEN_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=creds
              )

          def upload(
              service,
              path,
              title,
              description,
              tags
          ):

              from googleapiclient.http import (
                  MediaFileUpload
              )

              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": tags,
                      "categoryId": "28"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  mimetype="video/mp4",
                  chunksize=-1,
                  resumable=True
              )

              req = service.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = req.execute()

              print(
                  "UPLOADED:",
                  response["id"]
              )

              return response["id"]

          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "\n"
                  + "=" * 70
              )

              print(
                  "TECHMIND STUDIO"
              )

              print(
                  "REALISTIC MOTION ENGINE"
              )

              print(
                  "=" * 70
              )

              pkg = create_content()

              print(
                  "\nTOPIC:",
                  pkg["topic"]
              )

              print(
                  "TITLE:",
                  pkg["title"]
              )

              long_video = build_long(
                  pkg
              )

              short_video = build_short(
                  pkg
              )

              # --------------------------------------------------------
              # Quality check
              # --------------------------------------------------------

              for p in [
                  long_video,
                  short_video
              ]:

                  if not p.exists():
                      raise RuntimeError(
                          f"Missing: {p}"
                      )

                  if p.stat().st_size < 1_000_000:
                      raise RuntimeError(
                          f"Invalid video: {p}"
                      )

              # Long duration
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(long_video)
                  ],
                  stdout=subprocess.PIPE,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              print(
                  f"\nLONG DURATION: "
                  f"{duration:.2f}s"
              )

              if duration < 240:
                  raise RuntimeError(
                      "Long video below 4 minutes"
                  )

              # --------------------------------------------------------
              # Description
              # --------------------------------------------------------

              description = (
                  pkg["description"]
                  + "\n\n"
                  + " ".join(
                      pkg["hashtags"]
                  )
                  + "\n\n"
                  + "Produced by TechMind Studio."
              )

              if IMAGE_SOURCES:

                  description += (
                      "\n\nVisual sources:"
                  )

                  for source in IMAGE_SOURCES:

                      description += (
                          "\n- "
                          + source["title"]
                          + ": "
                          + source["url"]
                      )

              service = youtube()

              # --------------------------------------------------------
              # LONG
              # --------------------------------------------------------

              long_id = upload(
                  service,
                  long_video,
                  pkg["title"],
                  description,
                  pkg["tags"]
              )

              # --------------------------------------------------------
              # SHORT
              # --------------------------------------------------------

              short_title = (
                  pkg["title"]
                  + " #Shorts"
              )

              short_id = upload(
                  service,
                  short_video,
                  short_title,
                  description,
                  pkg["tags"]
              )

              # --------------------------------------------------------
              # Package
              # --------------------------------------------------------

              (ROOT / "package.json").write_text(
                  json.dumps(
                      {
                          **pkg,
                          "long_id": long_id,
                          "short_id": short_id,
                          "image_sources":
                              IMAGE_SOURCES
                      },
                      indent=2,
                      ensure_ascii=False
                  )
              )

              print(
                  "\n"
                  + "=" * 70
              )

              print(
                  "SUCCESS"
              )

              print(
                  "LONG:",
                  long_id
              )

              print(
                  "SHORT:",
                  short_id
              )

              print(
                  "=" * 70
              )


          if __name__ == "__main__":
              main()

          PY

