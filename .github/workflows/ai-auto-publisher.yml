name: AI Auto Publisher

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:00 PM India time (12:30 UTC)
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

            - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts Pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2      - name: Run AI Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY: public
        run: |
          python creator.py

      - name: Save Content Package
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-package
          path: content_package.json
          retention-days: 7

      - name: Save Automation State
        run: |
          git config user.name "TechMind Studio Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state.json

          if git diff --cached --quiet; then
            echo "No automation state changes to commit."
          else
            git commit -m "Update automation state"
            git push
          fi
