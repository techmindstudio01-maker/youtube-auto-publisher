      # =========================================================
      # 3. GEMINI CREATES SCRIPT + TITLE + DESCRIPTION + TAGS
      # =========================================================
      - name: Generate complete content package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import requests
          import json
          import os
          import time

          API_KEY = os.environ["GEMINI_API_KEY"]

          topic = open(
              "topic.txt",
              encoding="utf-8"
          ).read().strip()

          source = open(
              "source.txt",
              encoding="utf-8"
          ).read().strip()

          prompt = f"""
          You are the senior producer of a technology YouTube channel called TechMind.

          CURRENT AI TOPIC:
          {topic}

          SOURCE:
          {source}

          Create a complete YouTube content package.

          LONG-FORM VIDEO:
          - Write a 4 to 5 minute spoken YouTube script.
          - Start with a powerful hook in the first 10 seconds.
          - Explain what happened.
          - Explain why it matters.
          - Explain how the technology works.
          - Give practical real-world examples.
          - Explain who can use it.
          - Do not invent facts.
          - Use only information supported by the source.
          - Make the narration natural and engaging.
          - End with a short TechMind subscribe CTA.

          TITLE:
          - Attractive and clickable.
          - Truthful.
          - Maximum 90 characters.

          DESCRIPTION:
          - 2 to 4 useful paragraphs.
          - Explain the video clearly.
          - Add relevant hashtags at the end.
          - No spam.

          TAGS:
          - Generate 8 to 15 relevant YouTube tags.

          SHORT:
          - Write a 35 to 55 second YouTube Short script.
          - Very strong opening hook.
          - Focus on the most interesting part.
          - Fast, natural narration.
          - End with a short CTA.

          IMPORTANT:
          Return ONLY valid JSON.
          Do not use Markdown.
          Do not use ```json.
          Do not add explanations outside the JSON.

          RETURN THIS EXACT JSON STRUCTURE:

          {{
            "title": "YouTube title",
            "description": "YouTube description",
            "hashtags": [
              "#AI",
              "#ArtificialIntelligence"
            ],
            "tags": [
              "AI",
              "Artificial Intelligence"
            ],
            "long_script": "Full long-form script",
            "short_script": "Full Short script"
          }}
          """

          # -----------------------------------------------------
          # MODELS
          # -----------------------------------------------------
          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash"
          ]

          response = None
          successful_model = None

          # -----------------------------------------------------
          # TRY PRIMARY MODEL THEN AUTOMATIC FALLBACK
          # -----------------------------------------------------
          for model in models:

              print("")
              print("========================================")
              print("Trying Gemini model:", model)
              print("========================================")

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model
                  + ":generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              model_success = False

              for attempt in range(3):

                  print(
                      f"Attempt {attempt + 1}/3 "
                      f"for {model}"
                  )

                  try:

                      response = requests.post(
                          url,
                          headers={
                              "x-goog-api-key": API_KEY,
                              "Content-Type": "application/json"
                          },
                          json=payload,
                          timeout=180
                      )

                      print(
                          "Gemini HTTP status:",
                          response.status_code
                      )

                      # -------------------------------------------------
                      # TEMPORARY SERVER ERROR
                      # -------------------------------------------------
                      if response.status_code == 503:

                          print(
                              f"{model} is temporarily unavailable."
                          )

                          if attempt < 2:

                              wait_time = 15 * (attempt + 1)

                              print(
                                  f"Waiting {wait_time} seconds..."
                              )

                              time.sleep(wait_time)
                              continue

                          print(
                              f"{model} failed after 3 attempts."
                          )

                          break

                      # -------------------------------------------------
                      # OTHER HTTP ERROR
                      # -------------------------------------------------
                      response.raise_for_status()

                      model_success = True
                      successful_model = model

                      print(
                          "Gemini request successful using:",
                          model
                      )

                      break

                  except requests.exceptions.Timeout:

                      print(
                          f"{model} request timed out."
                      )

                      if attempt < 2:

                          wait_time = 15 * (attempt + 1)

                          print(
                              f"Retrying in {wait_time} seconds..."
                          )

                          time.sleep(wait_time)

                      else:

                          print(
                              f"{model} timed out after 3 attempts."
                          )

                  except requests.exceptions.RequestException as error:

                      print(
                          "Gemini request error:",
                          error
                      )

                      if attempt < 2:

                          wait_time = 15 * (attempt + 1)

                          print(
                              f"Retrying in {wait_time} seconds..."
                          )

                          time.sleep(wait_time)

                      else:

                          print(
                              f"{model} failed after 3 attempts."
                          )

              if model_success:
                  break

          # -----------------------------------------------------
          # NO MODEL WORKED
          # -----------------------------------------------------
          if not model_success:

              raise RuntimeError(
                  "All Gemini models failed. "
                  "Tried Gemini 3.8 Flash and Gemini 3.7 Flash."
              )

          # -----------------------------------------------------
          # READ RESPONSE
          # -----------------------------------------------------
          data = response.json()

          try:

              text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

          except (KeyError, IndexError):

              print("")
              print("Unexpected Gemini response:")
              print(
                  json.dumps(
                      data,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Could not read Gemini response."
              )

          text = text.strip()

          # -----------------------------------------------------
          # REMOVE MARKDOWN CODE FENCES
          # -----------------------------------------------------
          if text.startswith("```"):

              lines = text.splitlines()

              if lines:
                  lines = lines[1:]

              if lines and lines[-1].strip() == "```":
                  lines = lines[:-1]

              text = "\n".join(lines).strip()

          # -----------------------------------------------------
          # PARSE JSON
          # -----------------------------------------------------
          try:

              package = json.loads(text)

          except json.JSONDecodeError:

              print("")
              print("Gemini returned invalid JSON:")
              print(text)

              raise RuntimeError(
                  "Gemini output was not valid JSON."
              )

          # -----------------------------------------------------
          # VALIDATE JSON
          # -----------------------------------------------------
          required_fields = [
              "title",
              "description",
              "hashtags",
              "tags",
              "long_script",
              "short_script"
          ]

          for field in required_fields:

              if field not in package:

                  raise RuntimeError(
                      f"Missing Gemini field: {field}"
                  )

          # -----------------------------------------------------
          # SAVE TITLE
          # -----------------------------------------------------
          with open(
              "title.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(
                      package["title"]
                  ).strip()
              )

          # -----------------------------------------------------
          # SAVE DESCRIPTION
          # -----------------------------------------------------
          with open(
              "description.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(
                      package["description"]
                  ).strip()
              )

          # -----------------------------------------------------
          # SAVE LONG SCRIPT
          # -----------------------------------------------------
          with open(
              "long_script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(
                      package["long_script"]
                  ).strip()
              )

          # -----------------------------------------------------
          # SAVE SHORT SCRIPT
          # -----------------------------------------------------
          with open(
              "short_script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(
                      package["short_script"]
                  ).strip()
              )

          # -----------------------------------------------------
          # SAVE TAGS
          # -----------------------------------------------------
          with open(
              "tags.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  ",".join(
                      str(tag).strip()
                      for tag in package["tags"]
                  )
              )

          # -----------------------------------------------------
          # SAVE HASHTAGS
          # -----------------------------------------------------
          with open(
              "hashtags.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  " ".join(
                      str(tag).strip()
                      for tag in package["hashtags"]
                  )
              )

          # -----------------------------------------------------
          # SUCCESS
          # -----------------------------------------------------
          print("")
          print("========================================")
          print("CONTENT PACKAGE CREATED SUCCESSFULLY")
          print("========================================")
          print("MODEL USED:")
          print(successful_model)
          print("")
          print("TITLE:")
          print(package["title"])
          print("")
          print(
              "LONG SCRIPT CHARACTERS:",
              len(package["long_script"])
          )
          print("")
          print(
              "SHORT SCRIPT CHARACTERS:",
              len(package["short_script"])
          )
          print("========================================")
          PY
