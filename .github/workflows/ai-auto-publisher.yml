name: AI Auto Publisher

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:00 PM India time
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # FFMPEG
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            edge-tts \
            Pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2


      # ======================================================
      # AI CONTENT
      # ======================================================

      - name: Generate AI Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator.py


      # ======================================================
      # VERIFY CONTENT
      # ======================================================

      - name: Verify Content Package
        run: |
          python - <<'PY'
          import json
          import os

          if not os.path.exists("content_package.json"):
              raise SystemExit(
                  "ERROR: content_package.json was not created."
              )

          with open(
              "content_package.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("==========================================")
          print("Content package verified.")
          print("Title:", data.get("title"))
          print("Topic:", data.get("topic"))
          print("Script words:", data.get("script_word_count"))
          print("Long scenes:", len(data.get("scenes", [])))
          print("Short scenes:", len(data.get("short_scenes", [])))
          print("Hashtags:", " ".join(data.get("hashtags", [])))
          print("YouTube tags:", len(data.get("tags", [])))
          print("==========================================")
          PY


      # ======================================================
      # RENDER LONG VIDEO
      # ======================================================

      - name: Render Long Video
        run: |
          python video_renderer.py


      # ======================================================
      # VERIFY LONG VIDEO
      # ======================================================

      - name: Verify Long Video
        run: |
          if [ ! -f "techmind_studio_long.mp4" ]; then
            echo "ERROR: Long video was not created."
            exit 1
          fi

          echo "Long video created successfully."

          echo "Video duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            techmind_studio_long.mp4


      # ======================================================
      # UPLOAD LONG VIDEO TO YOUTUBE
      # ======================================================

      - name: Upload Long Video to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python upload_youtube.py


      # ======================================================
      # SAVE CONTENT PACKAGE
      # ======================================================

      - name: Save Content Package
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-package
          path: content_package.json
          retention-days: 7


      # ======================================================
      # SAVE LONG VIDEO
      # ======================================================

      - name: Save Long Video
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-long-video
          path: techmind_studio_long.mp4
          retention-days: 7


      # ======================================================
      # SAVE AUTOMATION STATE
      # ======================================================

      - name: Save Automation State
        run: |
          git config user.name "TechMind Studio Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state.json

          if git diff --cached --quiet; then
            echo "No automation state changes to commit."
          else
            git commit -m "Update automation state"
            git push
          fi
