name: TechMind Studio - Daily AI Creator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth edge-tts feedparser pillow

      - name: Create creator.py
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path

          import feedparser
          from PIL import Image, ImageDraw, ImageFont

          from google import genai
          from google.genai import types

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials


          ROOT = Path("production")
          VISUALS = ROOT / "visuals"
          AUDIO = ROOT / "audio"
          LONG = ROOT / "long_scenes"
          SHORT = ROOT / "short"
          THUMB = ROOT / "thumbnail"

          for d in [ROOT, VISUALS, AUDIO, LONG, SHORT, THUMB]:
              d.mkdir(parents=True, exist_ok=True)

          API_KEY = os.environ["GEMINI_API_KEY"]

          MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.8-flash"
          ]

          VOICE = "en-US-GuyNeural"

          FONT_BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"


          def run(cmd):
              print("\nRUN:", " ".join(map(str, cmd)))
              r = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )
              print(r.stdout[-4000:])
              if r.returncode != 0:
                  raise RuntimeError("Command failed")
              return r


          def duration(path):
              r = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True
              )
              return float(r.stdout.strip())


          def gemini(prompt):
              client = genai.Client(api_key=API_KEY)
              last = None

              for model in MODELS:
                  for attempt in range(1, 4):
                      print(f"GEMINI {model} ATTEMPT {attempt}/3")

                      try:
                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  temperature=0.75,
                                  max_output_tokens=16000
                              )
                          )

                          if response.text and len(response.text) > 200:
                              return response.text

                      except Exception as e:
                          last = e
                          print("GEMINI ERROR:", e)
                          time.sleep(5 * attempt)

              raise RuntimeError(f"Gemini failed: {last}")


          def news():
              feeds = [
                  "https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=generative+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=OpenAI+Gemini+AI&hl=en-US&gl=US&ceid=US:en"
              ]

              items = []
              seen = set()

              for url in feeds:
                  try:
                      feed = feedparser.parse(url)

                      for e in feed.entries[:10]:
                          title = getattr(e, "title", "").strip()
                          summary = re.sub(
                              r"<[^>]+>",
                              "",
                              getattr(e, "summary", "")
                          ).strip()

                          if title and title.lower() not in seen:
                              seen.add(title.lower())
                              items.append(
                                  f"- {title}: {summary[:700]}"
                              )
                  except Exception as e:
                      print("NEWS ERROR:", e)

              return "\n".join(items[:25])


          def package():
              prompt = f"""
          You are the senior producer for the YouTube channel:

          TECHMIND STUDIO

          Current AI news:
          {news()}

          Choose ONE interesting current AI topic.

          Create a completely original YouTube package.

          RETURN ONLY VALID JSON.

          {{
            "topic": "...",
            "title": "...",
            "description": "...",
            "hashtags": ["#AI","#Technology","#TechMindStudio"],
            "tags": ["AI","artificial intelligence","technology"],
            "scenes": [
              {{
                "visual_type": "...",
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ],
            "short_title": "...",
            "short_scenes": [
              {{
                "visual_type": "...",
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ]
          }}

          LONG VIDEO:

          Exactly 10 scenes.

          Total spoken narration must be approximately 700-850 words.

          Every scene must contain approximately 65-85 words.

          Each scene MUST have a DIFFERENT visual concept.

          visual_type must be one of:
          - hero
          - interface
          - comparison
          - diagram
          - example
          - statistics
          - warning
          - timeline
          - takeaway
          - conclusion

          Scene 1 = powerful hook.
          Scene 2 = current development.
          Scene 3 = what changed.
          Scene 4 = how it works.
          Scene 5 = practical example.
          Scene 6 = benefits.
          Scene 7 = limitations.
          Scene 8 = future/timeline.
          Scene 9 = key takeaway.
          Scene 10 = conclusion + natural CTA.

          Use natural spoken English.

          Do not copy articles.

          TITLE:
          Maximum 90 characters.
          Include 1-2 relevant emojis.

          DESCRIPTION:
          2-4 useful paragraphs.
          Include keywords naturally.
          End with hashtags.

          HASHTAGS:
          5-8 relevant hashtags.

          TAGS:
          10-20 relevant YouTube tags.

          SHORT:

          Exactly 5 scenes.
          Total duration around 35-55 seconds.
          Each scene 20-30 words.
          Strong hook in scene 1.
          Scene 5 should point viewers toward the full video.
          """


              raw = gemini(prompt)
              raw = re.sub(r"^```json", "", raw.strip())
              raw = re.sub(r"```$", "", raw.strip())

              start = raw.find("{")
              end = raw.rfind("}")

              data = json.loads(raw[start:end + 1])

              if len(data["scenes"]) < 10:
                  raise RuntimeError("Not enough long scenes")

              if len(data["short_scenes"]) < 5:
                  raise RuntimeError("Not enough short scenes")

              data["scenes"] = data["scenes"][:10]
              data["short_scenes"] = data["short_scenes"][:5]

              if "TechMind Studio" not in data["description"]:
                  data["description"] += "\n\nCreated by TechMind Studio."

              tags = " ".join(data["hashtags"])

              if tags not in data["description"]:
                  data["description"] += "\n\n" + tags

              return data


          def wrap(draw, text, font, max_chars):
              words = str(text).split()
              lines = []
              line = ""

              for word in words:
                  candidate = (line + " " + word).strip()

                  if len(candidate) > max_chars:
                      if line:
                          lines.append(line)
                      line = word
                  else:
                      line = candidate

              if line:
                  lines.append(line)

              return lines


          def visual(scene, index, output, vertical=False):
              W, H = (720, 1280) if vertical else (1280, 720)

              img = Image.new(
                  "RGB",
                  (W, H),
                  (
                      6 + index * 3 % 20,
                      10 + index * 5 % 25,
                      25 + index * 7 % 45
                  )
              )

              draw = ImageDraw.Draw(img)

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  48 if vertical else 58
              )

              body_font = ImageFont.truetype(
                  FONT_REG,
                  25 if vertical else 30
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  22
              )

              kind = scene.get(
                  "visual_type",
                  "hero"
              )

              # Background grid
              spacing = 60

              for x in range(0, W, spacing):
                  draw.line(
                      [(x, 0), (x, H)],
                      fill=(25, 38, 60),
                      width=1
                  )

              for y in range(0, H, spacing):
                  draw.line(
                      [(0, y), (W, y)],
                      fill=(25, 38, 60),
                      width=1
                  )

              # Different visual composition per scene
              if kind == "hero":
                  for i in range(8):
                      x = 100 + i * 140
                      y = H // 2 + int(
                          100 * ((i % 3) - 1)
                      )
                      draw.ellipse(
                          (x-25, y-25, x+25, y+25),
                          outline=(70,160,240),
                          width=4
                      )

              elif kind == "interface":
                  draw.rounded_rectangle(
                      (80, 120, W-80, H-180),
                      radius=30,
                      fill=(10,16,30),
                      outline=(70,140,230),
                      width=3
                  )

                  for i in range(5):
                      draw.rounded_rectangle(
                          (
                              120,
                              210+i*75,
                              W-120,
                              250+i*75
                          ),
                          radius=10,
                          fill=(25,55+i*10,90+i*15)
                      )

              elif kind == "comparison":
                  mid = W // 2
                  draw.line(
                      [(mid,120),(mid,H-140)],
                      fill=(100,150,220),
                      width=4
                  )

                  draw.rounded_rectangle(
                      (70,160,mid-40,H-180),
                      radius=25,
                      outline=(70,130,220),
                      width=4
                  )

                  draw.rounded_rectangle(
                      (mid+40,160,W-70,H-180),
                      radius=25,
                      outline=(90,190,150),
                      width=4
                  )

              elif kind == "diagram":
                  points = []

                  for i in range(5):
                      x = 140 + i * ((W-280)//4)
                      y = H//2 + (100 if i % 2 else -100)
                      points.append((x,y))

                  for i in range(len(points)-1):
                      draw.line(
                          [points[i], points[i+1]],
                          fill=(70,170,240),
                          width=6
                      )

                  for x,y in points:
                      draw.ellipse(
                          (x-35,y-35,x+35,y+35),
                          fill=(20,70,120),
                          outline=(100,200,255),
                          width=4
                      )

              elif kind == "example":
                  draw.rounded_rectangle(
                      (100,150,W-100,H-170),
                      radius=30,
                      fill=(9,15,28),
                      outline=(70,130,220),
                      width=3
                  )

                  for i in range(4):
                      draw.rectangle(
                          (
                              140+i*180,
                              H//2-100,
                              260+i*180,
                              H//2+100
                          ),
                          outline=(70,160,230),
                          width=4
                      )

              elif kind == "statistics":
                  base = H-180

                  for i in range(7):
                      height = 100 + ((index*83+i*71) % 300)
                      x = 110+i*150

                      draw.rounded_rectangle(
                          (
                              x,
                              base-height,
                              x+70,
                              base
                          ),
                          radius=12,
                          fill=(40,110,200)
                      )

              elif kind == "warning":
                  draw.polygon(
                      [
                          (W//2,120),
                          (W-160,H-170),
                          (160,H-170)
                      ],
                      outline=(220,150,60),
                      width=7
                  )

                  draw.line(
                      [
                          (W//2,H//2-90),
                          (W//2,H//2+80)
                      ],
                      fill=(230,180,90),
                      width=10
                  )

              elif kind == "timeline":
                  y = H//2

                  draw.line(
                      [(100,y),(W-100,y)],
                      fill=(80,160,230),
                      width=8
                  )

                  for i in range(5):
                      x = 150+i*((W-300)//4)

                      draw.ellipse(
                          (x-25,y-25,x+25,y+25),
                          fill=(30,100,170),
                          outline=(120,200,255),
                          width=4
                      )

              elif kind == "takeaway":
                  draw.rounded_rectangle(
                      (100,170,W-100,H-200),
                      radius=35,
                      fill=(10,18,32),
                      outline=(90,160,240),
                      width=4
                  )

                  for i in range(3):
                      draw.line(
                          [
                              (170,320+i*100),
                              (W-170,320+i*100)
                          ],
                          fill=(55,120,190),
                          width=6
                      )

              else:
                  draw.ellipse(
                      (W//2-180,H//2-180,
                       W//2+180,H//2+180),
                      outline=(80,180,255),
                      width=8
                  )

              # Main text panel
              panel_y = 70 if vertical else 55

              draw.rounded_rectangle(
                  (
                      45,
                      panel_y,
                      W-45,
                      H-45
                  ),
                  radius=28,
                  outline=(55,100,165),
                  width=2
              )

              draw.text(
                  (75, panel_y+30),
                  f"TECHMIND STUDIO  •  SCENE {index:02d}",
                  font=small_font,
                  fill=(120,195,255)
              )

              title = scene["visual_title"]

              title_lines = wrap(
                  draw,
                  title,
                  title_font,
                  22 if vertical else 34
              )

              y = (
                  145
                  if vertical
                  else 150
              )

              for line in title_lines[:3]:
                  draw.text(
                      (75,y),
                      line,
                      font=title_font,
                      fill="white"
                  )
                  y += 62 if vertical else 70

              body_lines = wrap(
                  draw,
                  scene["visual_text"],
                  body_font,
                  27 if vertical else 52
              )

              y = H-430 if vertical else H-310

              for line in body_lines[:5]:
                  draw.text(
                      (75,y),
                      line,
                      font=body_font,
                      fill=(215,225,240)
                  )
                  y += 38 if vertical else 45

              draw.text(
                  (75,H-90),
                  "TECHMIND STUDIO",
                  font=small_font,
                  fill=(120,195,255)
              )

              img.save(
                  output,
                  quality=95
              )


          def voice(text, output):
              run([
                  "edge-tts",
                  "--voice",
                  VOICE,
                  "--rate=-5%",
                  "--text",
                  text,
                  "--write-media",
                  str(output)
              ])


          def scene_video(image, audio, output, vertical=False, index=1):
              dur = duration(audio)
              frames = max(30, int(dur * 30))

              if index % 2:
                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0012,1.13)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={'720x1280' if vertical else '1280x720'}:"
                      "fps=30"
                  )
              else:
                  zoom = (
                      "zoompan="
                      "z='if(lte(zoom,1.001),1.12,max(1.0,zoom-0.0012))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={'720x1280' if vertical else '1280x720'}:"
                      "fps=30"
                  )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-i", str(audio),
                  "-vf", zoom,
                  "-t", str(dur),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  str(output)
              ])


          def concat(files, output):
              lst = ROOT / "concat.txt"

              with open(lst, "w") as f:
                  for p in files:
                      f.write(
                          f"file '{Path(p).resolve()}'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(lst),
                  "-c", "copy",
                  str(output)
              ])


          def build_long(data):
              files = []

              for i, scene in enumerate(
                  data["scenes"],
                  1
              ):
                  print(
                      f"LONG SCENE {i}/10"
                  )

                  words = len(
                      scene["voiceover"].split()
                  )

                  if words < 50:
                      raise RuntimeError(
                          f"Scene {i} narration too short"
                      )

                  image = VISUALS / f"long_{i:02d}.jpg"
                  audio = AUDIO / f"long_{i:02d}.mp3"
                  video = LONG / f"scene_{i:02d}.mp4"

                  visual(
                      scene,
                      i,
                      image,
                      False
                  )

                  voice(
                      scene["voiceover"],
                      audio
                  )

                  scene_video(
                      image,
                      audio,
                      video,
                      False,
                      i
                  )

                  files.append(video)

              raw = ROOT / "long_raw.mp4"
              final = ROOT / "TechMind_Studio_Long.mp4"

              concat(files, raw)

              run([
                  "ffmpeg",
                  "-y",
                  "-i", str(raw),
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "21",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-movflags", "+faststart",
                  str(final)
              ])

              d = duration(final)

              print(
                  "FINAL LONG:",
                  round(d,2),
                  "seconds"
              )

              if d < 240:
                  raise RuntimeError(
                      f"Long video below 4 minutes: {d:.1f}s"
                  )

              return final


          def build_short(data):
              files = []

              for i, scene in enumerate(
                  data["short_scenes"],
                  1
              ):
                  print(
                      f"SHORT SCENE {i}/5"
                  )

                  image = SHORT / f"visual_{i:02d}.jpg"
                  audio = SHORT / f"audio_{i:02d}.mp3"
                  video = SHORT / f"scene_{i:02d}.mp4"

                  visual(
                      scene,
                      i,
                      image,
                      True
                  )

                  voice(
                      scene["voiceover"],
                      audio
                  )

                  scene_video(
                      image,
                      audio,
                      video,
                      True,
                      i
                  )

                  files.append(video)

              raw = SHORT / "short_raw.mp4"
              final = ROOT / "TechMind_Studio_Short.mp4"

              concat(files, raw)

              run([
                  "ffmpeg",
                  "-y",
                  "-i", str(raw),
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "22",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-movflags", "+faststart",
                  str(final)
              ])

              d = duration(final)

              print(
                  "FINAL SHORT:",
                  round(d,2),
                  "seconds"
              )

              if d < 20:
                  raise RuntimeError("Short too short")

              return final


          def thumbnail(data):
              out = THUMB / "thumbnail.jpg"

              img = Image.new(
                  "RGB",
                  (1280,720),
                  (5,10,22)
              )

              draw = ImageDraw.Draw(img)

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  68
              )

              small = ImageFont.truetype(
                  FONT_BOLD,
                  30
              )

              for i in range(18):
                  x = 70 + (i*97)%1140
                  y = 70 + (i*61)%570
                  r = 18 + (i%5)*8

                  draw.ellipse(
                      (x-r,y-r,x+r,y+r),
                      outline=(60,140,230),
                      width=3
                  )

              draw.rounded_rectangle(
                  (55,55,1225,665),
                  radius=35,
                  fill=(5,9,18),
                  outline=(75,140,230),
                  width=3
              )

              title = data["title"]

              words = title.split()
              lines = []
              line = ""

              for w in words:
                  candidate = (line+" "+w).strip()

                  if len(candidate) > 24:
                      if line:
                          lines.append(line)
                      line = w
                  else:
                      line = candidate

              if line:
                  lines.append(line)

              y = 170

              for line in lines[:4]:
                  box = draw.textbbox(
                      (0,0),
                      line,
                      font=title_font
                  )

                  tw = box[2]-box[0]

                  draw.text(
                      ((1280-tw)/2,y),
                      line,
                      font=title_font,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 90

              draw.text(
                  (90,590),
                  "TECHMIND STUDIO",
                  font=small,
                  fill=(120,195,255)
              )

              img.save(out, quality=95)
              return out


          def youtube():
              token = json.loads(
                  os.environ["YOUTUBE_TOKEN_JSON"]
              )

              creds = Credentials.from_authorized_user_info(
                  token,
                  scopes=[
                      "https://www.googleapis.com/auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=creds
              )


          def upload(api, path, title, description, tags, thumb=None):
              print("UPLOADING:", path)

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": tags[:30],
                      "categoryId": "28"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  chunksize=8*1024*1024,
                  resumable=True
              )

              request = api.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None

              while response is None:
                  status, response = request.next_chunk()

                  if status:
                      print(
                          "UPLOAD:",
                          int(status.progress()*100),
                          "%"
                      )

              vid = response["id"]

              print(
                  "UPLOAD SUCCESS:",
                  vid
              )

              if thumb:
                  try:
                      api.thumbnails().set(
                          videoId=vid,
                          media_body=MediaFileUpload(
                              str(thumb),
                              mimetype="image/jpeg"
                          )
                      ).execute()

                      print("THUMBNAIL SUCCESS")

                  except Exception as e:
                      print(
                          "THUMBNAIL WARNING:",
                          e
                      )

              return vid


          def main():
              print(
                  "\n================================"
              )
              print(
                  "TECHMIND STUDIO AUTOMATION"
              )
              print(
                  "================================"
              )

              data = package()

              print(
                  "TOPIC:",
                  data["topic"]
              )

              print(
                  "TITLE:",
                  data["title"]
              )

              (ROOT/"metadata.json").write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              long_video = build_long(data)
              short_video = build_short(data)
              thumb = thumbnail(data)

              api = youtube()

              long_id = upload(
                  api,
                  long_video,
                  data["title"],
                  data["description"],
                  data["tags"],
                  thumb
              )

              short_id = upload(
                  api,
                  short_video,
                  data["short_title"],
                  data["description"] + "\n\n#Shorts",
                  data["tags"]
              )

              print(
                  "\n================================"
              )
              print(
                  "TECHMIND STUDIO AUTOMATION COMPLETE"
              )
              print(
                  "LONG VIDEO:",
                  long_id
              )
              print(
                  "SHORT:",
                  short_id
              )
              print(
                  "================================"
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Run production
        run: |
          python creator.py

      - name: Save production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-production
