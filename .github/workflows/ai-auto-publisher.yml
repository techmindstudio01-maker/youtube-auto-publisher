name: TechMind AI Creator - Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth edge-tts feedparser pillow requests

      - name: Create creator.py
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          import feedparser
          from PIL import Image, ImageDraw, ImageFont

          from google import genai
          from google.genai import types

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials


          # ============================================================
          # CONFIG
          # ============================================================

          ROOT = Path("production")

          VISUAL_DIR = ROOT / "visuals"
          AUDIO_DIR = ROOT / "audio"
          LONG_SCENE_DIR = ROOT / "long_scenes"
          SHORT_DIR = ROOT / "short"
          THUMB_DIR = ROOT / "thumbnail"

          for folder in [
              ROOT,
              VISUAL_DIR,
              AUDIO_DIR,
              LONG_SCENE_DIR,
              SHORT_DIR,
              THUMB_DIR
          ]:
              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

          GEMINI_API_KEY = os.environ[
              "GEMINI_API_KEY"
          ]

          TEXT_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.8-flash"
          ]

          VOICE = "en-US-GuyNeural"


          # ============================================================
          # COMMAND RUNNER
          # ============================================================

          def run(cmd, check=True):

              print(
                  "\nRUN:",
                  " ".join(map(str, cmd))
              )

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(
                  result.stdout[-5000:]
              )

              if check and result.returncode != 0:
                  raise RuntimeError(
                      "Command failed."
                  )

              return result


          # ============================================================
          # FRESH AI NEWS
          # ============================================================

          def get_news():

              feeds = [
                  "https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=generative+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=OpenAI+Gemini+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=AI+technology&hl=en-US&gl=US&ceid=US:en"
              ]

              results = []
              seen = set()

              for url in feeds:

                  try:

                      feed = feedparser.parse(url)

                      for entry in feed.entries[:10]:

                          title = getattr(
                              entry,
                              "title",
                              ""
                          ).strip()

                          summary = getattr(
                              entry,
                              "summary",
                              ""
                          )

                          summary = re.sub(
                              r"<[^>]+>",
                              "",
                              summary
                          ).strip()

                          if title:

                              key = title.lower()

                              if key not in seen:

                                  seen.add(key)

                                  results.append({
                                      "title": title,
                                      "summary": summary[:1000]
                                  })

                  except Exception as e:

                      print(
                          "NEWS WARNING:",
                          e
                      )

              return results[:30]


          # ============================================================
          # GEMINI TEXT
          # ============================================================

          def gemini_text(prompt):

              client = genai.Client(
                  api_key=GEMINI_API_KEY
              )

              last_error = None

              for model in TEXT_MODELS:

                  for attempt in range(1, 4):

                      print(
                          f"TEXT MODEL={model} "
                          f"ATTEMPT={attempt}/3"
                      )

                      try:

                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  temperature=0.75,
                                  max_output_tokens=16000
                              )
                          )

                          text = response.text

                          if text and len(
                              text.strip()
                          ) > 200:

                              print(
                                  "TEXT SUCCESS:",
                                  model
                              )

                              return text

                          raise RuntimeError(
                              "Empty Gemini response."
                          )

                      except Exception as e:

                          last_error = e

                          print(
                              "TEXT ERROR:",
                              type(e).__name__,
                              str(e)[:500]
                          )

                          err = str(e).lower()

                          retryable = any(
                              word in err
                              for word in [
                                  "429",
                                  "500",
                                  "502",
                                  "503",
                                  "504",
                                  "timeout",
                                  "timed out",
                                  "unavailable"
                              ]
                          )

                          if retryable:

                              wait = 5 * attempt

                              print(
                                  f"Waiting {wait}s..."
                              )

                              time.sleep(wait)

                          else:

                              break

                  print(
                      "Trying next text model..."
                  )

              raise RuntimeError(
                  f"Gemini text generation failed: "
                  f"{last_error}"
              )


          # ============================================================
          # PARSE JSON
          # ============================================================

          def parse_json(text):

              text = text.strip()

              text = re.sub(
                  r"^```json",
                  "",
                  text
              )

              text = re.sub(
                  r"^```",
                  "",
                  text
              )

              text = re.sub(
                  r"```$",
                  "",
                  text
              )

              text = text.strip()

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1:

                  raise RuntimeError(
                      "No JSON returned by Gemini."
                  )

              return json.loads(
                  text[start:end + 1]
              )


          # ============================================================
          # AI CONTENT PACKAGE
          # ============================================================

          def create_package():

              news = get_news()

              if news:

                  news_text = "\n".join(
                      [
                          f"- {item['title']}: "
                          f"{item['summary']}"
                          for item in news
                      ]
                  )

              else:

                  news_text = (
                      "No fresh feed available. "
                      "Choose a current major AI topic."
                  )

              prompt = f"""
          You are the senior producer for a professional
          AI and technology YouTube channel called
          TechMind AI.

          CURRENT AI NEWS:

          {news_text}

          Choose ONE strong current AI topic.

          Create an ORIGINAL YouTube package.

          RETURN ONLY VALID JSON.

          EXACT JSON STRUCTURE:

          {{
            "topic": "...",
            "title": "...",
            "description": "...",
            "hashtags": [
              "#AI",
              "#ArtificialIntelligence"
            ],
            "tags": [
              "AI",
              "artificial intelligence"
            ],
            "long_script": "...",
            "scenes": [
              {{
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ],
            "short_title": "...",
            "short_scenes": [
              {{
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ]
          }}

          ============================================================
          LONG VIDEO REQUIREMENTS
          ============================================================

          The long video MUST be approximately 4-5 minutes.

          Generate approximately 700-800 spoken words.

          Generate EXACTLY 10 scenes.

          EACH scene voiceover MUST contain approximately
          65-80 spoken words.

          Do NOT make the voiceovers short.

          The 10 scenes should naturally produce a
          4-5 minute video when spoken by a natural voice.

          Scene structure:

          Scene 1:
          Extremely strong hook.
          Explain why viewers should care.

          Scene 2:
          Explain the current development.

          Scene 3:
          Explain what changed.

          Scene 4:
          Explain how the technology works.

          Scene 5:
          Give a practical example.

          Scene 6:
          Explain benefits.

          Scene 7:
          Explain limitations or risks.

          Scene 8:
          Explain what happens next.

          Scene 9:
          Give useful takeaway for viewers.

          Scene 10:
          Strong conclusion and natural subscribe CTA.

          Every scene MUST have:

          - different visual concept
          - short visual title
          - short visual text
          - 65-80 word voiceover

          Do not copy news articles.

          Rewrite everything in original language.

          Use natural spoken English.

          Avoid robotic writing.

          Avoid filler.

          ============================================================
          TITLE
          ============================================================

          Maximum 90 characters.

          Strong but truthful.

          Include 1 or 2 relevant emojis.

          ============================================================
          DESCRIPTION
          ============================================================

          Write 2-4 useful paragraphs.

          Explain the video.

          Include relevant search keywords naturally.

          End with the hashtags.

          ============================================================
          HASHTAGS
          ============================================================

          5-8 relevant hashtags.

          ============================================================
          TAGS
          ============================================================

          10-20 relevant YouTube tags.

          ============================================================
          SHORT
          ============================================================

          Create a 35-55 second Short.

          EXACTLY 5 scenes.

          Each voiceover should be approximately
          20-30 words.

          First scene must have an extremely strong hook.

          Final scene should encourage viewers
          to watch the full video.
          """

              raw = gemini_text(
                  prompt
              )

              package = parse_json(
                  raw
              )

              # --------------------------------------------------------
              # VALIDATION
              # --------------------------------------------------------

              required = [
                  "topic",
                  "title",
                  "description",
                  "hashtags",
                  "tags",
                  "long_script",
                  "scenes",
                  "short_title",
                  "short_scenes"
              ]

              for field in required:

                  if field not in package:

                      raise RuntimeError(
                          f"Missing field: {field}"
                      )

              scenes = package["scenes"]

              if len(scenes) < 10:

                  raise RuntimeError(
                      "AI returned fewer than 10 scenes."
                  )

              # Keep exactly first 10.
              package["scenes"] = scenes[:10]

              short_scenes = package[
                  "short_scenes"
              ]

              if len(short_scenes) < 5:

                  raise RuntimeError(
                      "AI returned fewer than 5 short scenes."
                  )

              package["short_scenes"] = (
                  short_scenes[:5]
              )

              # --------------------------------------------------------
              # HARD WORD CHECK
              # --------------------------------------------------------

              total_words = len(
                  package[
                      "long_script"
                  ].split()
              )

              print(
                  "LONG SCRIPT WORDS:",
                  total_words
              )

              if total_words < 650:

                  raise RuntimeError(
                      f"Long script too short: "
                      f"{total_words} words."
                  )

              # Scene voiceover check.
              for i, scene in enumerate(
                  package["scenes"],
                  start=1
              ):

                  words = len(
                      scene[
                          "voiceover"
                      ].split()
                  )

                  print(
                      f"SCENE {i} WORDS:",
                      words
                  )

                  if words < 50:

                      raise RuntimeError(
                          f"Scene {i} voiceover "
                          f"is too short: "
                          f"{words} words."
                      )

              # Ensure hashtags in description.
              hashtag_text = " ".join(
                  package["hashtags"]
              )

              if hashtag_text not in package[
                  "description"
              ]:

                  package["description"] += (
                      "\n\n"
                      + hashtag_text
                  )

              return package


          # ============================================================
          # FONTS
          # ============================================================

          FONT_BOLD = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          FONT_REGULAR = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans.ttf"
          )


          # ============================================================
          # PROCEDURAL TECH VISUAL
          # ============================================================

          def create_visual(
              title,
              text,
              index,
              output,
              width=1280,
              height=720
          ):

              # Different background for every scene.
              bg = (
                  7 + (index * 13) % 25,
                  12 + (index * 19) % 30,
                  25 + (index * 29) % 55
              )

              img = Image.new(
                  "RGB",
                  (width, height),
                  bg
              )

              draw = ImageDraw.Draw(
                  img
              )

              title_size = (
                  52
                  if height == 720
                  else 42
              )

              text_size = (
                  29
                  if height == 720
                  else 23
              )

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  title_size
              )

              text_font = ImageFont.truetype(
                  FONT_REGULAR,
                  text_size
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  23
              )

              # Grid.
              grid = 70

              for x in range(
                  0,
                  width,
                  grid
              ):

                  draw.line(
                      [(x, 0), (x, height)],
                      fill=(30, 42, 62),
                      width=1
                  )

              for y in range(
                  0,
                  height,
                  grid
              ):

                  draw.line(
                      [(0, y), (width, y)],
                      fill=(30, 42, 62),
                      width=1
                  )

              # Tech nodes.
              nodes = []

              for j in range(7):

                  x = (
                      100 +
                      (
                          index * 149 +
                          j * 173
                      ) %
                      max(
                          width - 200,
                          1
                      )
                  )

                  y = (
                      100 +
                      (
                          index * 83 +
                          j * 107
                      ) %
                      max(
                          height - 230,
                          1
                      )
                  )

                  nodes.append(
                      (x, y)
                  )

                  radius = (
                      22 +
                      ((index + j) % 4)
                      * 10
                  )

                  draw.ellipse(
                      [
                          x-radius,
                          y-radius,
                          x+radius,
                          y+radius
                      ],
                      outline=(
                          65,
                          135,
                          225
                      ),
                      width=3
                  )

              # Connections.
              for j in range(
                  len(nodes) - 1
              ):

                  draw.line(
                      [
                          nodes[j],
                          nodes[j+1]
                      ],
                      fill=(
                          70,
                          120,
                          205
                      ),
                      width=3
                  )

              # Main panel.
              panel = (
                  65,
                  65,
                  width - 65,
                  height - 65
              )

              draw.rounded_rectangle(
                  panel,
                  radius=28,
                  fill=(5, 9, 18),
                  outline=(70, 110, 170),
                  width=2
              )

              # Scene label.
              draw.text(
                  (105, 100),
                  f"SCENE {index:02d}",
                  font=small_font,
                  fill=(110, 185, 255)
              )

              # Title.
              title = str(title)

              if len(title) > 52:

                  title = (
                      title[:49]
                      + "..."
                  )

              draw.text(
                  (105, 155),
                  title,
                  font=title_font,
                  fill="white"
              )

              # Text wrapping.
              words = str(text).split()

              lines = []
              line = ""

              max_chars = (
                  39
                  if height == 720
                  else 26
              )

              for word in words:

                  candidate = (
                      line + " " + word
                  ).strip()

                  if len(candidate) > max_chars:

                      if line:
                          lines.append(line)

                      line = word

                  else:

                      line = candidate

              if line:
                  lines.append(line)

              y = (
                  270
                  if height == 720
                  else 300
              )

              line_gap = (
                  46
                  if height == 720
                  else 38
              )

              for line in lines[:6]:

                  draw.text(
                      (110, y),
                      line,
                      font=text_font,
                      fill=(215, 225, 240)
                  )

                  y += line_gap

              # Decorative circuit bars.
              for j in range(5):

                  x = (
                      105 +
                      j * 150
                  )

                  bar_height = (
                      25 +
                      ((index + j * 3)
                       % 100)
                  )

                  draw.rounded_rectangle(
                      [
                          x,
                          height - 155,
                          x + 75,
                          height - 155 +
                          bar_height
                      ],
                      radius=8,
                      fill=(45, 105, 180)
                  )

              # Branding.
              draw.text(
                  (105, height - 72),
                  "TECHMIND AI",
                  font=small_font,
                  fill=(115, 190, 255)
              )

              img.save(
                  output,
                  quality=95
              )


          # ============================================================
          # TTS
          # ============================================================

          def create_voice(
              text,
              output
          ):

              run([
                  "edge-tts",
                  "--voice",
                  VOICE,
                  "--rate=-5%",
                  "--text",
                  text,
                  "--write-media",
                  str(output)
              ])

              if not Path(
                  output
              ).exists():

                  raise RuntimeError(
                      "Voice file was not created."
                  )


          # ============================================================
          # MEDIA DURATION
          # ============================================================

          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True
              )

              value = (
                  result.stdout.strip()
              )

              if not value:

                  raise RuntimeError(
                      f"Could not determine duration: "
                      f"{path}"
                  )

              return float(value)


          # ============================================================
          # SRT
          # ============================================================

          def srt_time(seconds):

              seconds = max(
                  0,
                  float(seconds)
              )

              hours = int(
                  seconds // 3600
              )

              minutes = int(
                  (seconds % 3600) // 60
              )

              secs = int(
                  seconds % 60
              )

              millis = int(
                  (
                      seconds -
                      int(seconds)
                  ) * 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{millis:03d}"
              )


          def create_srt(
              script,
              total,
              output
          ):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  script.strip()
              )

              sentences = [
                  x.strip()
                  for x in sentences
                  if x.strip()
              ]

              if not sentences:
                  return

              total_words = sum(
                  len(x.split())
                  for x in sentences
              )

              current = 0.0
              rows = []

              for i, sentence in enumerate(
                  sentences,
                  start=1
              ):

                  words = len(
                      sentence.split()
                  )

                  part = (
                      total *
                      words /
                      max(
                          total_words,
                          1
                      )
                  )

                  start = current
                  end = min(
                      total,
                      current + part
                  )

                  rows.append(
                      f"{i}\n"
                      f"{srt_time(start)} --> "
                      f"{srt_time(end)}\n"
                      f"{sentence}\n"
                  )

                  current = end

              Path(
                  output
              ).write_text(
                  "\n".join(rows),
                  encoding="utf-8"
              )


          # ============================================================
          # LONG SCENE VIDEO
          # ============================================================

          def make_long_scene(
              image,
              audio,
              output,
              index
          ):

              audio_duration = duration(
                  audio
              )

              frames = max(
                  30,
                  int(
                      audio_duration * 30
                  )
              )

              if index % 2 == 0:

                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0009,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=1280x720:"
                      "fps=30"
                  )

              else:

                  zoom = (
                      "zoompan="
                      "z='if(lte(zoom,1.001),"
                      "1.12,max(1.0,"
                      "zoom-0.0009))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=1280x720:"
                      "fps=30"
                  )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-i",
                  str(audio),
                  "-vf",
                  zoom,
                  "-t",
                  str(audio_duration),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "22",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  str(output)
              ])


          # ============================================================
          # CONCAT
          # ============================================================

          def concat(
              files,
              output
          ):

              list_file = (
                  ROOT /
                  "concat.txt"
              )

              with open(
                  list_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for file in files:

                      path = Path(
                          file
                      ).resolve()

                      f.write(
                          "file '"
                          + str(path)
                          + "'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  str(output)
              ])


          # ============================================================
          # BUILD LONG VIDEO
          # ============================================================

          def build_long(
              package
          ):

              scenes = package[
                  "scenes"
              ]

              scene_files = []

              print(
                  "\n================================"
              )

              print(
                  "CREATING LONG VIDEO"
              )

              print(
                  "================================"
              )

              for i, scene in enumerate(
                  scenes[:10],
                  start=1
              ):

                  voice_words = len(
                      scene[
                          "voiceover"
                      ].split()
                  )

                  print(
                      f"\nSCENE {i}/10 "
                      f"WORDS={voice_words}"
                  )

                  if voice_words < 50:

                      raise RuntimeError(
                          f"Scene {i} voiceover "
                          f"is too short: "
                          f"{voice_words} words."
                      )

                  image = (
                      VISUAL_DIR /
                      f"visual_{i:02d}.jpg"
                  )

                  audio = (
                      AUDIO_DIR /
                      f"audio_{i:02d}.mp3"
                  )

                  video = (
                      LONG_SCENE_DIR /
                      f"scene_{i:02d}.mp4"
                  )

                  create_visual(
                      scene[
                          "visual_title"
                      ],
                      scene[
                          "visual_text"
                      ],
                      i,
                      image
                  )

                  create_voice(
                      scene[
                          "voiceover"
                      ],
                      audio
                  )

                  make_long_scene(
                      image,
                      audio,
                      video,
                      i
                  )

                  scene_files.append(
                      video
                  )

              raw = (
                  ROOT /
                  "long_raw.mp4"
              )

              concat(
                  scene_files,
                  raw
              )

              final = (
                  ROOT /
                  "TechMind_AI_Long.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "21",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              # Captions.
              srt = (
                  ROOT /
                  "captions.srt"
              )

              create_srt(
                  package[
                      "long_script"
                  ],
                  duration(final),
                  srt
              )

              final_duration = duration(
                  final
              )

              print(
                  "\nFINAL LONG DURATION:",
                  round(
                      final_duration,
                      2
                  ),
                  "seconds"
              )

              # 4 minutes minimum.
              if final_duration < 240:

                  raise RuntimeError(
                      "Long video is below "
                      "4 minutes: "
                      f"{final_duration:.1f}s"
                  )

              # 5.5 minutes upper warning.
              if final_duration > 330:

                  print(
                      "WARNING: Long video "
                      "is above 5.5 minutes."
                  )

              return final


          # ============================================================
          # BUILD SHORT
          # ============================================================

          def build_short(
              package
          ):

              scenes = package[
                  "short_scenes"
              ][:5]

              files = []

              print(
                  "\n================================"
              )

              print(
                  "CREATING SHORT"
              )

              print(
                  "================================"
              )

              for i, scene in enumerate(
                  scenes,
                  start=1
              ):

                  image = (
                      SHORT_DIR /
                      f"visual_{i:02d}.jpg"
                  )

                  audio = (
                      SHORT_DIR /
                      f"audio_{i:02d}.mp3"
                  )

                  video = (
                      SHORT_DIR /
                      f"scene_{i:02d}.mp4"
                  )

                  create_visual(
                      scene[
                          "visual_title"
                      ],
                      scene[
                          "visual_text"
                      ],
                      i,
                      image,
                      720,
                      1280
                  )

                  create_voice(
                      scene[
                          "voiceover"
                      ],
                      audio
                  )

                  dur = duration(
                      audio
                  )

                  frames = max(
                      30,
                      int(dur * 30)
                  )

                  vf = (
                      "scale=720:1280:"
                      "force_original_aspect_ratio="
                      "decrease,"
                      "pad=720:1280:"
                      "(ow-iw)/2:(oh-ih)/2,"
                      "zoompan="
                      "z='min(zoom+0.001,1.10)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=720x1280:"
                      "fps=30"
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-t",
                      str(dur),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",
                      "-pix_fmt",
                      "yuv420p",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",
                      "-shortest",
                      str(video)
                  ])

                  files.append(
                      video
                  )

              raw = (
                  SHORT_DIR /
                  "short_raw.mp4"
              )

              concat(
                  files,
                  raw
              )

              final = (
                  ROOT /
                  "TechMind_AI_Short.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "22",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              short_duration = duration(
                  final
              )

              print(
                  "SHORT DURATION:",
                  round(
                      short_duration,
                      2
                  ),
                  "seconds"
              )

              if short_duration < 20:

                  raise RuntimeError(
                      "Short is below 20 seconds."
                  )

              return final


          # ============================================================
          # THUMBNAIL
          # ============================================================

          def create_thumbnail(
              package
          ):

              output = (
                  THUMB_DIR /
                  "thumbnail.jpg"
              )

              img = Image.new(
                  "RGB",
                  (1280, 720),
                  (7, 13, 28)
              )

              draw = ImageDraw.Draw(
                  img
              )

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  70
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  30
              )

              # Background tech network.
              for i in range(15):

                  x = (
                      50 +
                      (
                          i * 113
                      ) % 1180
                  )

                  y = (
                      60 +
                      (
                          i * 79
                      ) % 580
                  )

                  r = (
                      25 +
                      (i % 5) * 12
                  )

                  draw.ellipse(
                      [
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ],
                      outline=(
                          60,
                          130,
                          230
                      ),
                      width=3
                  )

              # Main panel.
              draw.rounded_rectangle(
                  (65, 65, 1215, 655),
                  radius=35,
                  fill=(5, 9, 18),
                  outline=(
                      80,
                      140,
                      230
                  ),
                  width=3
              )

              title = package[
                  "title"
              ]

              if len(title) > 55:

                  title = (
                      title[:52]
                      + "..."
                  )

              # Wrap.
              words = title.split()

              lines = []
              current = ""

              for word in words:

                  candidate = (
                      current
                      + " "
                      + word
                  ).strip()

                  if len(candidate) > 25:

                      if current:
                          lines.append(
                              current
                          )

                      current = word

                  else:

                      current = candidate

              if current:
                  lines.append(
                      current
                  )

              y = 180

              for line in lines[:4]:

                  bbox = draw.textbbox(
                      (0, 0),
                      line,
                      font=title_font
                  )

                  text_width = (
                      bbox[2] - bbox[0]
                  )

                  draw.text(
                      (
                          (1280 -
                           text_width) / 2,
                          y
                      ),
                      line,
                      font=title_font,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 90

              draw.text(
                  (100, 575),
                  "TECHMIND AI",
                  font=small_font,
                  fill=(
                      110,
                      185,
                      255
                  )
              )

              img.save(
                  output,
                  quality=95
              )

              return output


          # ============================================================
          # YOUTUBE CLIENT
          # ============================================================

          def youtube_client():

              token = json.loads(
                  os.environ[
                      "YOUTUBE_TOKEN_JSON"
                  ]
              )

              credentials = (
                  Credentials
                  .from_authorized_user_info(
                      token,
                      scopes=[
                          "https://www.googleapis.com/"
                          "auth/youtube.upload"
                      ]
                  )
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          # ============================================================
          # YOUTUBE UPLOAD
          # ============================================================

          def upload_video(
              api,
              path,
              title,
              description,
              tags,
              thumbnail=None
          ):

              print(
                  "\nUPLOADING:",
                  path
              )

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": tags[:30],
                      "categoryId": "28"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  chunksize=8 * 1024 * 1024,
                  resumable=True
              )

              request = (
                  api.videos().insert(
                      part="snippet,status",
                      body=body,
                      media_body=media
                  )
              )

              response = None

              while response is None:

                  status, response = (
                      request.next_chunk()
                  )

                  if status:

                      print(
                          "UPLOAD:",
                          int(
                              status.progress()
                              * 100
                          ),
                          "%"
                      )

              video_id = response[
                  "id"
              ]

              print(
                  "UPLOAD SUCCESS:",
                  video_id
              )

              if thumbnail:

                  try:

                      api.thumbnails().set(
                          videoId=video_id,
                          media_body=MediaFileUpload(
                              str(thumbnail),
                              mimetype="image/jpeg"
                          )
                      ).execute()

                      print(
                          "THUMBNAIL SUCCESS"
                      )

                  except Exception as e:

                      print(
                          "THUMBNAIL WARNING:",
                          e
                      )

              return video_id


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "\n======================================"
              )

              print(
                  "TECHMIND AI AUTOMATION START"
              )

              print(
                  "======================================"
              )

              package = create_package()

              print(
                  "\nTOPIC:",
                  package["topic"]
              )

              print(
                  "TITLE:",
                  package["title"]
              )

              print(
                  "HASHTAGS:",
                  package["hashtags"]
              )

              print(
                  "TAGS:",
                  package["tags"]
              )

              # Save metadata.
              (
                  ROOT /
                  "metadata.json"
              ).write_text(
                  json.dumps(
                      package,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              # Long.
              long_video = build_long(
                  package
              )

              # Short.
              short_video = build_short(
                  package
              )

              # Thumbnail.
              thumb = create_thumbnail(
                  package
              )

              # YouTube.
              api = youtube_client()

              long_id = upload_video(
                  api,
                  long_video,
                  package["title"],
                  package["description"],
                  package["tags"],
                  thumb
              )

              short_description = (
                  package["description"]
                  + "\n\n#Shorts"
              )

              short_id = upload_video(
                  api,
                  short_video,
                  package["short_title"],
                  short_description,
                  package["tags"]
              )

              print(
                  "\n======================================"
              )

              print(
                  "AUTOMATION COMPLETE"
              )

              print(
                  "LONG VIDEO ID:",
                  long_id
              )

              print(
                  "SHORT ID:",
                  short_id
              )

              print(
                  "======================================"
              )


          if __name__ == "__main__":
              main()

