name: AI Auto Publisher

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:00 PM India time (12:30 UTC)
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Install FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 4. Install Python packages
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            edge-tts \
            Pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ==========================================
      # 5. Generate AI content
      # ==========================================
      - name: Generate AI Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator.py

      # ==========================================
      # 6. Check generated content
      # ==========================================
      - name: Verify Content Package
        run: |
          python - <<'PY'
          import json
          import os

          if not os.path.exists("content_package.json"):
              raise SystemExit(
                  "ERROR: content_package.json was not created."
              )

          with open(
              "content_package.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("Content package verified.")
          print("Title:", data.get("title"))
          print("Script words:", data.get("script_word_count"))
          print("Scenes:", len(data.get("scenes", [])))
          PY

      # ==========================================
      # 7. Save Content Package
      # ==========================================
      - name: Save Content Package
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-package
          path: content_package.json
          retention-days: 7

      # ==========================================
      # 8. Save Automation State
      # ==========================================
      - name: Save Automation State
        run: |
          git config user.name "TechMind Studio Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state.json

          if git diff --cached --quiet; then
            echo "No automation state changes to commit."
          else
            git commit -m "Update automation state"
            git push
          fi
