              )

              if short_duration < 20:

                  raise RuntimeError(
                      "Short is below 20 seconds."
                  )

              return final


          # ============================================================
          # THUMBNAIL
          # ============================================================

          def create_thumbnail(
              data
          ):

              output = (
                  THUMB_DIR /
                  "thumbnail.jpg"
              )

              img = Image.new(
                  "RGB",
                  (1280,720),
                  (5,10,22)
              )

              draw = ImageDraw.Draw(
                  img
              )

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  68
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  30
              )

              # Tech network background
              for i in range(18):

                  x = (
                      50
                      + (
                          i*97
                      ) % 1180
                  )

                  y = (
                      50
                      + (
                          i*67
                      ) % 600
                  )

                  r = (
                      18
                      + (
                          i%5
                      )*8
                  )

                  draw.ellipse(
                      (
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ),
                      outline=(
                          60,
                          140,
                          230
                      ),
                      width=3
                  )

              draw.rounded_rectangle(
                  (
                      55,
                      55,
                      1225,
                      665
                  ),
                  radius=35,
                  fill=(5,9,18),
                  outline=(
                      75,
                      140,
                      230
                  ),
                  width=3
              )

              title = str(
                  data["title"]
              )

              lines = wrap_text(
                  title,
                  24
              )

              y = 165

              for line in lines[:4]:

                  box = draw.textbbox(
                      (0,0),
                      line,
                      font=title_font
                  )

                  tw = (
                      box[2]-box[0]
                  )

                  draw.text(
                      (
                          (1280-tw)/2,
                          y
                      ),
                      line,
                      font=title_font,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 90

              draw.text(
                  (90,590),
                  "TECHMIND STUDIO",
                  font=small_font,
                  fill=(120,195,255)
              )

              img.save(
                  output,
                  quality=95
              )

              return output


          # ============================================================
          # YOUTUBE
          # ============================================================

          def youtube_client():

              token = json.loads(
                  os.environ[
                      "YOUTUBE_TOKEN_JSON"
                  ]
              )

              credentials = (
                  Credentials
                  .from_authorized_user_info(
                      token,
                      scopes=[
                          "https://www.googleapis.com/"
                          "auth/youtube.upload"
                      ]
                  )
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          # ============================================================
          # YOUTUBE UPLOAD
          # ============================================================

          def upload_video(
              api,
              path,
              title,
              description,
              tags,
              thumbnail=None
          ):

              print(
                  "\n================================"
              )

              print(
                  "UPLOADING:",
                  path
              )

              print(
                  "================================"
              )

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": tags[:30],
                      "categoryId": "28"
                  },

                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  chunksize=8*1024*1024,
                  resumable=True
              )

              request = (
                  api.videos().insert(
                      part="snippet,status",
                      body=body,
                      media_body=media
                  )
              )

              response = None

              while response is None:

                  status, response = (
                      request.next_chunk()
                  )

                  if status:

                      print(
                          "UPLOAD:",
                          int(
                              status.progress()*100
                          ),
                          "%"
                      )

              video_id = response[
                  "id"
              ]

              print(
                  "UPLOAD SUCCESS:",
                  video_id
              )

              if thumbnail:

                  try:

                      api.thumbnails().set(
                          videoId=video_id,
                          media_body=MediaFileUpload(
                              str(thumbnail),
                              mimetype="image/jpeg"
                          )
                      ).execute()

                      print(
                          "THUMBNAIL SUCCESS"
                      )

                  except Exception as e:

                      print(
                          "THUMBNAIL WARNING:",
                          e
                      )

              return video_id


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "\n"
                  "========================================"
              )

              print(
                  "TECHMIND STUDIO AI CREATOR"
              )

              print(
                  "REAL IMAGE + MOTION EDITION"
              )

              print(
                  "========================================"
              )

              data = create_package()

              print(
                  "\nTOPIC:",
                  data["topic"]
              )

              print(
                  "TITLE:",
                  data["title"]
              )

              print(
                  "HASHTAGS:",
                  data["hashtags"]
              )

              print(
                  "TAGS:",
                  data["tags"]
              )

              # --------------------------------------------------------
              # Build long video
              # --------------------------------------------------------

              long_video = build_long(
                  data
              )

              # --------------------------------------------------------
              # Build short
              # --------------------------------------------------------

              short_video = build_short(
                  data
              )

              # --------------------------------------------------------
              # Thumbnail
              # --------------------------------------------------------

              thumbnail = create_thumbnail(
                  data
              )

              # --------------------------------------------------------
              # Add image source information
              # --------------------------------------------------------

              if IMAGE_SOURCES:

                  source_lines = [
                      "\n\nVisual sources:"
                  ]

                  unique_sources = set()

                  for source in IMAGE_SOURCES:

                      url = source["url"]

                      if url in unique_sources:
                          continue

                      unique_sources.add(
                          url
                      )

                      source_lines.append(
                          "- "
                          + source["title"]
                          + ": "
                          + url
                      )

                  data["description"] += (
                      "\n".join(
                          source_lines
                      )
                  )

              # Save metadata
              (
                  ROOT /
                  "metadata.json"
              ).write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              # Save source list
              (
                  ROOT /
                  "image_sources.json"
              ).write_text(
                  json.dumps(
                      IMAGE_SOURCES,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              # --------------------------------------------------------
              # YouTube
              # --------------------------------------------------------

              api = youtube_client()

              long_id = upload_video(
                  api,
                  long_video,
                  data["title"],
                  data["description"],
                  data["tags"],
                  thumbnail
              )

              short_description = (
                  data["description"]
                  + "\n\n#Shorts"
              )

              short_id = upload_video(
                  api,
                  short_video,
                  data["short_title"],
                  short_description,
                  data["tags"]
              )

              print(
                  "\n"
                  "========================================"
              )

              print(
                  "TECHMIND STUDIO AUTOMATION COMPLETE"
              )

              print(
                  "LONG VIDEO ID:",
                  long_id
              )

              print(
                  "SHORT VIDEO ID:",
                  short_id
              )

              print(
                  "REAL IMAGES USED:",
                  len(IMAGE_SOURCES)
              )

              print(
                  "========================================"
              )


          if __name__ == "__main__":
              main()

          PY

      - name: Run production
        run: |
          python creator.py

      - name: Save production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-production
          path: production/
          if-no-files-found: warn
          retention-days: 7
