                  )

              raw = (
                  SHORT_DIR /
                  "short_raw.mp4"
              )

              final = (
                  ROOT /
                  "TechMind_Studio_Short.mp4"
              )

              concat_videos(
                  scene_files,
                  raw
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "22",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              short_duration = duration(
