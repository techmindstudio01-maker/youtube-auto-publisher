name: TechMind Studio - Daily AI Creator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth edge-tts feedparser pillow requests

      - name: Create creator.py
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path

          import requests
          import feedparser

          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          from google import genai
          from google.genai import types

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials


          # ============================================================
          # TECHMIND STUDIO
          # ============================================================

          ROOT = Path("production")

          VISUAL_DIR = ROOT / "visuals"
          AUDIO_DIR = ROOT / "audio"
          LONG_DIR = ROOT / "long_scenes"
          SHORT_DIR = ROOT / "short"
          THUMB_DIR = ROOT / "thumbnail"

          for folder in [
              ROOT,
              VISUAL_DIR,
              AUDIO_DIR,
              LONG_DIR,
              SHORT_DIR,
              THUMB_DIR
          ]:
              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


          GEMINI_API_KEY = os.environ[
              "GEMINI_API_KEY"
          ]

          TEXT_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.8-flash"
          ]

          VOICE = "en-US-GuyNeural"

          FONT_BOLD = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          FONT_REGULAR = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans.ttf"
          )

          USED_IMAGES = set()
          IMAGE_SOURCES = []


          # ============================================================
          # COMMAND RUNNER
          # ============================================================

          def run(cmd):

              print(
                  "\nRUN:",
                  " ".join(map(str, cmd))
              )

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(
                  result.stdout[-5000:]
              )

              if result.returncode != 0:

                  raise RuntimeError(
                      "Command failed."
                  )

              return result


          # ============================================================
          # MEDIA DURATION
          # ============================================================

          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True
              )

              value = result.stdout.strip()

              if not value:

                  raise RuntimeError(
                      f"Could not determine duration: {path}"
                  )

              return float(value)


          # ============================================================
          # NEWS
          # ============================================================

          def get_news():

              feeds = [

                  "https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=en-US&gl=US&ceid=US:en",

                  "https://news.google.com/rss/search?q=generative+AI&hl=en-US&gl=US&ceid=US:en",

                  "https://news.google.com/rss/search?q=OpenAI+Gemini+AI&hl=en-US&gl=US&ceid=US:en",

                  "https://news.google.com/rss/search?q=AI+technology&hl=en-US&gl=US&ceid=US:en"

              ]

              results = []
              seen = set()

              for url in feeds:

                  try:

                      feed = feedparser.parse(
                          url
                      )

                      for entry in feed.entries[:10]:

                          title = getattr(
                              entry,
                              "title",
                              ""
                          ).strip()

                          summary = getattr(
                              entry,
                              "summary",
                              ""
                          )

                          summary = re.sub(
                              r"<[^>]+>",
                              "",
                              summary
                          ).strip()

                          if not title:
                              continue

                          key = title.lower()

                          if key in seen:
                              continue

                          seen.add(key)

                          results.append(
                              {
                                  "title": title,
                                  "summary": summary[:900]
                              }
                          )

                  except Exception as e:

                      print(
                          "NEWS WARNING:",
                          e
                      )

              return results[:30]


          # ============================================================
          # GEMINI
          # ============================================================

          def gemini_text(prompt):

              client = genai.Client(
                  api_key=GEMINI_API_KEY
              )

              last_error = None

              for model in TEXT_MODELS:

                  for attempt in range(1, 4):

                      print(
                          f"TEXT MODEL={model} "
                          f"ATTEMPT={attempt}/3"
                      )

                      try:

                          response = (
                              client.models.generate_content(
                                  model=model,
                                  contents=prompt,
                                  config=types.GenerateContentConfig(
                                      temperature=0.75,
                                      max_output_tokens=16000
                                  )
                              )
                          )

                          text = response.text

                          if text and len(
                              text.strip()
                          ) > 200:

                              print(
                                  "TEXT SUCCESS:",
                                  model
                              )

                              return text

                          raise RuntimeError(
                              "Empty Gemini response."
                          )

                      except Exception as e:

                          last_error = e

                          print(
                              "TEXT ERROR:",
                              type(e).__name__,
                              str(e)[:500]
                          )

                          time.sleep(
                              5 * attempt
                          )

                  print(
                      "Trying next Gemini model..."
                  )

              raise RuntimeError(
                  f"Gemini failed: {last_error}"
              )


          # ============================================================
          # CREATE CONTENT PACKAGE
          # ============================================================

          def create_package():

              news = get_news()

              if news:

                  news_text = "\n".join(
                      [
                          f"- {item['title']}: "
                          f"{item['summary']}"
                          for item in news
                      ]
                  )

              else:

                  news_text = (
                      "No fresh feed available. "
                      "Choose a major current AI topic."
                  )


              prompt = f"""
          You are the senior producer for a professional
          AI and technology YouTube channel called:

          TECHMIND STUDIO

          CURRENT AI NEWS:

          {news_text}

          Choose ONE strong current AI topic.

          Create an ORIGINAL YouTube package.

          RETURN ONLY VALID JSON.

          EXACT STRUCTURE:

          {{
            "topic": "...",
            "title": "...",
            "description": "...",
            "hashtags": [
              "#AI",
              "#ArtificialIntelligence",
              "#Technology"
            ],
            "tags": [
              "AI",
              "artificial intelligence",
              "technology"
            ],
            "scenes": [
              {{
                "visual_type": "hero",
                "visual_search": "...",
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ],
            "short_title": "...",
            "short_scenes": [
              {{
                "visual_type": "hero",
                "visual_search": "...",
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ]
          }}

          ============================================================
          LONG VIDEO
          ============================================================

          EXACTLY 10 SCENES.

          Target 700-850 spoken words.

          Every scene approximately 65-85 words.

          Scene 1:
          Powerful hook.

          Scene 2:
          Explain current development.

          Scene 3:
          Explain what changed.

          Scene 4:
          Explain how the technology works.

          Scene 5:
          Practical real-world example.

          Scene 6:
          Benefits.

          Scene 7:
          Limitations and risks.

          Scene 8:
          Future/timeline.

          Scene 9:
          Key takeaway.

          Scene 10:
          Strong conclusion and natural CTA.

          ============================================================
          VISUALS
          ============================================================

          Every scene MUST have a DIFFERENT visual concept.

          Use visual_type from:

          hero
          company
          product
          interface
          comparison
          diagram
          example
          statistics
          warning
          timeline
          future

          visual_search MUST describe a REAL IMAGE that
          would visually match the scene.

          Examples:

          "OpenAI headquarters"
          "Google Gemini AI interface"
          "AI robot computer"
          "artificial intelligence data center"
          "AI chip semiconductor"
          "machine learning neural network"

          Do NOT use generic searches like
          "technology background".

          ============================================================
          TITLE
          ============================================================

          Maximum 90 characters.

          Include 1 or 2 relevant emojis.

          Strong but truthful.

          ============================================================
          DESCRIPTION
          ============================================================

          2-4 useful paragraphs.

          Explain the video.

          Include relevant search keywords.

          End with hashtags.

          ============================================================
          HASHTAGS
          ============================================================

          5-8 relevant hashtags.

          ============================================================
          TAGS
          ============================================================

          10-20 relevant YouTube tags.

          ============================================================
          SHORT
          ============================================================

          Exactly 5 scenes.

          Target 35-55 seconds.

          Each voiceover 20-30 words.

          Strong hook in scene 1.

          Scene 5 should encourage viewers
          to watch the full video.

          Every Short scene must have
          a DIFFERENT visual_search.
          """


              raw = gemini_text(
                  prompt
              )

              raw = raw.strip()

              raw = re.sub(
                  r"^```json",
                  "",
                  raw
              )

              raw = re.sub(
                  r"^```",
                  "",
                  raw
              )

              raw = re.sub(
                  r"```$",
                  "",
                  raw
              )

              start = raw.find("{")
              end = raw.rfind("}")

              if start == -1 or end == -1:

                  raise RuntimeError(
                      "Gemini did not return JSON."
                  )

              data = json.loads(
                  raw[start:end + 1]
              )

              required = [
                  "topic",
                  "title",
                  "description",
                  "hashtags",
                  "tags",
                  "scenes",
                  "short_title",
                  "short_scenes"
              ]

              for field in required:

                  if field not in data:

                      raise RuntimeError(
                          f"Missing field: {field}"
                      )

              if len(data["scenes"]) < 10:

                  raise RuntimeError(
                      "Long video has fewer than 10 scenes."
                  )

              if len(data["short_scenes"]) < 5:

                  raise RuntimeError(
                      "Short has fewer than 5 scenes."
                  )

              data["scenes"] = (
                  data["scenes"][:10]
              )

              data["short_scenes"] = (
                  data["short_scenes"][:5]
              )

              # Ensure TechMind Studio branding.
              if "TechMind Studio" not in data[
                  "description"
              ]:

                  data["description"] += (
                      "\n\nCreated by TechMind Studio."
                  )

              hashtags = " ".join(
                  data["hashtags"]
              )

              if hashtags not in data[
                  "description"
              ]:

                  data["description"] += (
                      "\n\n"
                      + hashtags
                  )

              return data


          # ============================================================
          # WRAP TEXT
          # ============================================================

          def wrap_text(
              text,
              max_chars
          ):

              words = str(text).split()

              lines = []
              current = ""

              for word in words:

                  candidate = (
                      current
                      + " "
                      + word
                  ).strip()

                  if len(candidate) > max_chars:

                      if current:
                          lines.append(
                              current
                          )

                      current = word

                  else:

                      current = candidate

              if current:
                  lines.append(
                      current
                  )

              return lines


          # ============================================================
          # REAL IMAGE SEARCH
          # ============================================================

          def search_real_image(
              queries,
              output
          ):

              global USED_IMAGES
              global IMAGE_SOURCES

              for query in queries:

                  if not query:
                      continue

                  print(
                      "\nIMAGE SEARCH:",
                      query
                  )

                  try:

                      api_url = (
                          "https://commons.wikimedia.org/"
                          "w/api.php"
                      )

                      params = {
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": query,
                          "gsrnamespace": 6,
                          "gsrlimit": 12,
                          "prop": "imageinfo",
                          "iiprop": "url|mime",
                          "iiurlwidth": 1600,
                          "format": "json"
                      }

                      response = requests.get(
                          api_url,
                          params=params,
                          timeout=20,
                          headers={
                              "User-Agent":
                              "TechMindStudio/1.0"
                          }
                      )

                      response.raise_for_status()

                      data = response.json()

                      pages = (
                          data
                          .get("query", {})
                          .get("pages", {})
                      )

                      for page in pages.values():

                          info = page.get(
                              "imageinfo",
                              []
                          )

                          if not info:
                              continue

                          item = info[0]

                          mime = item.get(
                              "mime",
                              ""
                          )

                          if not mime.startswith(
                              "image/"
                          ):
                              continue

                          image_url = (
                              item.get("thumburl")
                              or item.get("url")
                          )

                          if not image_url:
                              continue

                          if image_url in USED_IMAGES:
                              continue

                          try:

                              image_response = (
                                  requests.get(
                                      image_url,
                                      timeout=30,
                                      headers={
                                          "User-Agent":
                                          "TechMindStudio/1.0"
                                      }
                                  )
                              )

                              image_response.raise_for_status()

                              Path(
                                  output
                              ).write_bytes(
                                  image_response.content
                              )

                              test = Image.open(
                                  output
                              )

                              test.verify()

                              USED_IMAGES.add(
                                  image_url
                              )

                              source = {
                                  "query": query,
                                  "title": page.get(
                                      "title",
                                      ""
                                  ),
                                  "url": image_url
                              }

                              IMAGE_SOURCES.append(
                                  source
                              )

                              print(
                                  "REAL IMAGE FOUND:",
                                  image_url
                              )

                              return source

                          except Exception as e:

                              print(
                                  "IMAGE ERROR:",
                                  e
                              )

                  except Exception as e:

                      print(
                          "SEARCH ERROR:",
                          e
                      )

              print(
                  "NO REAL IMAGE FOUND."
              )

              return None


          # ============================================================
          # FALLBACK VISUAL
          # ============================================================

          def fallback_visual(
              scene,
              index,
              output,
              vertical=False
          ):

              W, H = (
                  (720,1280)
                  if vertical
                  else
                  (1280,720)
              )

              img = Image.new(
                  "RGB",
                  (W,H),
                  (
                      6 + index * 3 % 20,
                      11 + index * 5 % 25,
                      25 + index * 7 % 45
                  )
              )

              draw = ImageDraw.Draw(
                  img
              )

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  44 if vertical else 56
              )

              body_font = ImageFont.truetype(
                  FONT_REGULAR,
                  24 if vertical else 30
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  21
              )

              # Grid
              for x in range(
                  0,
                  W,
                  65
              ):

                  draw.line(
                      [(x,0),(x,H)],
                      fill=(25,40,65),
                      width=1
                  )

              for y in range(
                  0,
                  H,
                  65
              ):

                  draw.line(
                      [(0,y),(W,y)],
                      fill=(25,40,65),
                      width=1
                  )

              # Large cinematic rings
              cx = W // 2
              cy = H // 2

              for radius in [
                  250,
                  200,
                  150,
                  100
              ]:

                  draw.ellipse(
                      (
                          cx-radius,
                          cy-radius,
                          cx+radius,
                          cy+radius
                      ),
                      outline=(
                          60,
                          150,
                          240
                      ),
                      width=4
                  )

              # Nodes
              nodes = []

              for i in range(8):

                  x = (
                      80
                      + (
                          i*171
                          + index*73
                      ) % max(
                          W-160,
                          1
                      )
                  )

                  y = (
                      120
                      + (
                          i*119
                          + index*67
                      ) % max(
                          H-240,
                          1
                      )
                  )

                  nodes.append(
                      (x,y)
                  )

              for i in range(
                  len(nodes)-1
              ):

                  draw.line(
                      [
                          nodes[i],
                          nodes[i+1]
                      ],
                      fill=(45,105,180),
                      width=3
                  )

              for x,y in nodes:

                  draw.ellipse(
                      (
                          x-18,
                          y-18,
                          x+18,
                          y+18
                      ),
                      fill=(35,95,170),
                      outline=(100,200,255),
                      width=3
                  )

              # Main panel
              draw.rounded_rectangle(
                  (
                      40,
                      40,
                      W-40,
                      H-40
                  ),
                  radius=28,
                  outline=(65,115,180),
                  width=2
              )

              draw.text(
                  (70,70),
                  f"TECHMIND STUDIO • SCENE {index:02d}",
                  font=small_font,
                  fill=(120,195,255)
              )

              title = scene.get(
                  "visual_title",
                  "AI Technology"
              )

              title_lines = wrap_text(
                  title,
                  20 if vertical else 34
              )

              y = (
                  145
                  if vertical
                  else 150
              )

              for line in title_lines[:3]:

                  draw.text(
                      (70,y),
                      line,
                      font=title_font,
                      fill="white"
                  )

                  y += (
                      58
                      if vertical
                      else 70
                  )

              body_lines = wrap_text(
                  scene.get(
                      "visual_text",
                      ""
                  ),
                  27 if vertical else 50
              )

              y = (
                  H-390
                  if vertical
                  else H-270
              )

              for line in body_lines[:5]:

                  draw.text(
                      (70,y),
                      line,
                      font=body_font,
                      fill=(220,230,242)
                  )

                  y += (
                      36
                      if vertical
                      else 44
                  )

              draw.text(
                  (70,H-80),
                  "TECHMIND STUDIO",
                  font=small_font,
                  fill=(120,195,255)
              )

              img.save(
                  output,
                  quality=94
              )


          # ============================================================
          # SMART VISUAL CREATOR
          # ============================================================

          def create_visual(
              scene,
              index,
              output,
              vertical,
              topic
          ):

              title = scene.get(
                  "visual_title",
                  ""
              )

              search = scene.get(
                  "visual_search",
                  ""
              )

              text = scene.get(
                  "visual_text",
                  ""
              )

              queries = [

                  search,

                  title,

                  f"{topic} {title}",

                  f"{topic} technology",

                  f"{title} AI",

              ]

              source = search_real_image(
                  queries,
                  output
              )

              if source:

                  try:

                      img = Image.open(
                          output
                      ).convert("RGB")

                      W,H = (
                          (720,1280)
                          if vertical
                          else
                          (1280,720)
                      )

                      # Cover crop
                      scale = max(
                          W/img.width,
                          H/img.height
                      )

                      nw = int(
                          img.width*scale
                      )

                      nh = int(
                          img.height*scale
                      )

                      img = img.resize(
                          (nw,nh),
                          Image.Resampling.LANCZOS
                      )

                      left = (
                          nw-W
                      )//2

                      top = (
                          nh-H
                      )//2

                      img = img.crop(
                          (
                              left,
                              top,
                              left+W,
                              top+H
                          )
                      )

                      # Slight cinematic blur layer
                      soft = img.filter(
                          ImageFilter.GaussianBlur(
                              1.2
                          )
                      )

                      img = Image.blend(
                          img,
                          soft,
                          0.10
                      )

                      # Dark overlay
                      overlay = Image.new(
                          "RGBA",
                          (W,H),
                          (0,0,0,65)
                      )

                      img = Image.alpha_composite(
                          img.convert("RGBA"),
                          overlay
                      )

                      draw = ImageDraw.Draw(
                          img
                      )

                      title_font = ImageFont.truetype(
                          FONT_BOLD,
                          42 if vertical else 50
                      )

                      small_font = ImageFont.truetype(
                          FONT_BOLD,
                          20
                      )

                      # Top branding
                      draw.rounded_rectangle(
                          (
                              30,
                              25,
                              W-30,
                              88
                          ),
                          radius=18,
                          fill=(0,0,0,160)
                      )

                      draw.text(
                          (52,43),
                          "TECHMIND STUDIO",
                          font=small_font,
                          fill=(150,215,255)
                      )

                      # Bottom cinematic panel
                      panel_height = (
                          360
                          if vertical
                          else 250
                      )

                      draw.rounded_rectangle(
                          (
                              30,
                              H-panel_height-25,
                              W-30,
                              H-25
                          ),
                          radius=26,
                          fill=(0,0,0,185)
                      )

                      title_lines = wrap_text(
                          title,
                          21 if vertical else 39
                      )

                      y = (
                          H-panel_height+5
                      )

                      for line in title_lines[:3]:

                          draw.text(
                              (55,y),
                              line,
                              font=title_font,
                              fill="white",
                              stroke_width=2,
                              stroke_fill="black"
                          )

                          y += (
                              52
                              if vertical
                              else 62
                          )

                      text_lines = wrap_text(
                          text,
                          28 if vertical else 55
                      )

                      body_y = (
                          H-190
                          if vertical
                          else H-120
                      )

                      if not vertical:

                          body_y = H-105

                      for line in text_lines[-2:]:

                          draw.text(
                              (55,body_y),
                              line,
                              font=small_font,
                              fill=(220,230,240)
                          )

                          body_y += 28

                      draw.text(
                          (55,H-62),
                          f"SCENE {index:02d}",
                          font=small_font,
                          fill=(150,215,255)
                      )

                      img.convert(
                          "RGB"
                      ).save(
                          output,
                          quality=94
                      )

                      print(
                          "USING REAL IMAGE:",
                          index
                      )

                      return source

                  except Exception as e:

                      print(
                          "REAL IMAGE PROCESSING ERROR:",
                          e
                      )

              # Fallback
              print(
                  "USING FALLBACK VISUAL:",
                  index
              )

              fallback_visual(
                  scene,
                  index,
                  output,
                  vertical
              )

              return None


          # ============================================================
          # EDGE TTS
          # ============================================================

          def create_voice(
              text,
              output
          ):

              run([
                  "edge-tts",
                  "--voice",
                  VOICE,
                  "--rate=-5%",
                  "--text",
                  text,
                  "--write-media",
                  str(output)
              ])

              if not Path(
                  output
              ).exists():

                  raise RuntimeError(
                      "Voice file missing."
                  )


          # ============================================================
          # SCENE VIDEO
          # ============================================================

          def make_scene_video(
              image,
              audio,
              output,
              vertical,
              index
          ):

              d = duration(
                  audio
              )

              frames = max(
                  30,
                  int(d*30)
              )

              resolution = (
                  "720x1280"
                  if vertical
                  else
                  "1280x720"
              )

              # Alternate motion direction
              if index % 2 == 0:

                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0011,1.14)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={resolution}:"
                      "fps=30"
                  )

              else:

                  zoom = (
                      "zoompan="
                      "z='if(lte(zoom,1.001),"
                      "1.12,max(1.0,zoom-0.0011))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={resolution}:"
                      "fps=30"
                  )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-i",
                  str(audio),
                  "-vf",
                  zoom,
                  "-t",
                  str(d),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "22",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  str(output)
              ])


          # ============================================================
          # CONCAT
          # ============================================================

          def concat_videos(
              files,
              output
          ):

              list_file = (
                  ROOT /
                  "concat.txt"
              )

              with open(
                  list_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for file in files:

                      path = Path(
                          file
                      ).resolve()

                      f.write(
                          "file '"
                          + str(path)
                          + "'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  str(output)
              ])


          # ============================================================
          # LONG VIDEO
          # ============================================================

          def build_long(
              data
          ):

              scene_files = []

              print(
                  "\n================================"
              )

              print(
                  "BUILDING TECHMIND STUDIO LONG VIDEO"
              )

              print(
                  "================================"
              )

              for i, scene in enumerate(
                  data["scenes"],
                  start=1
              ):

                  print(
                      f"\nLONG SCENE {i}/10"
                  )

                  words = len(
                      scene[
                          "voiceover"
                      ].split()
                  )

                  print(
                      "VOICE WORDS:",
                      words
                  )

                  if words < 50:

                      raise RuntimeError(
                          f"Scene {i} narration too short."
                      )

                  image = (
                      VISUAL_DIR /
                      f"long_visual_{i:02d}.jpg"
                  )

                  audio = (
                      AUDIO_DIR /
                      f"long_audio_{i:02d}.mp3"
                  )

                  video = (
                      LONG_DIR /
                      f"scene_{i:02d}.mp4"
                  )

                  create_visual(
                      scene,
                      i,
                      image,
                      False,
                      data["topic"]
                  )

                  create_voice(
                      scene[
                          "voiceover"
                      ],
                      audio
                  )

                  make_scene_video(
                      image,
                      audio,
                      video,
                      False,
                      i
                  )

                  scene_files.append(
                      video
                  )

              raw = (
                  ROOT /
                  "long_raw.mp4"
              )

              final = (
                  ROOT /
                  "TechMind_Studio_Long.mp4"
              )

              concat_videos(
                  scene_files,
                  raw
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "21",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              final_duration = duration(
                  final
              )

              print(
                  "\nFINAL LONG DURATION:",
                  round(
                      final_duration,
                      2
                  ),
                  "seconds"
              )

              if final_duration < 240:

                  raise RuntimeError(
                      "Long video is below "
                      f"4 minutes: "
                      f"{final_duration:.1f}s"
                  )

              if final_duration > 330:

                  print(
                      "WARNING: Long video above "
                      "5.5 minutes."
                  )

              return final


          # ============================================================
          # SHORT VIDEO
          # ============================================================

          def build_short(
              data
          ):

              scene_files = []

              print(
                  "\n================================"
              )

              print(
                  "BUILDING TECHMIND STUDIO SHORT"
              )

              print(
                  "================================"
              )

              for i, scene in enumerate(
                  data["short_scenes"],
                  start=1
              ):

