name: TechMind Studio - Daily AI Creator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # 1. SYSTEM
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu \
            fonts-liberation \
            imagemagick

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            google-api-python-client \
            google-auth \
            edge-tts \
            requests \
            pillow \
            feedparser

      # ============================================================
      # 2. CREATE ENGINE
      # ============================================================
      - name: Create production engine
        shell: bash
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import math
          import random
          import shutil
          import subprocess
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont
          from google import genai
          import edge_tts

          # ==========================================================
          # CONFIG
          # ==========================================================

          BRAND = "TECHMIND STUDIO"

          ROOT = Path("production")
          LONG_DIR = ROOT / "long"
          SHORT_DIR = ROOT / "short"
          AUDIO_DIR = ROOT / "audio"

          LONG_DIR.mkdir(parents=True, exist_ok=True)
          SHORT_DIR.mkdir(parents=True, exist_ok=True)
          AUDIO_DIR.mkdir(parents=True, exist_ok=True)

          LONG_W = 1920
          LONG_H = 1080

          SHORT_W = 1080
          SHORT_H = 1920

          FPS = 30

          USED_IMAGES = set()
          IMAGE_SOURCES = []

          # ==========================================================
          # HELPERS
          # ==========================================================

          def run(cmd):
              print("RUN:", " ".join(map(str, cmd)))
              p = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )
              print(p.stdout)
              if p.returncode != 0:
                  raise RuntimeError("Command failed")
              return p.stdout

          def clean_json(text):
              text = text.strip()

              if "```" in text:
                  text = re.sub(r"```(?:json)?", "", text)
                  text = text.replace("```", "")

              start = text.find("{")
              end = text.rfind("}")

              if start >= 0 and end >= 0:
                  text = text[start:end + 1]

              return json.loads(text)

          def safe_name(s):
              s = re.sub(r"[^a-zA-Z0-9_-]+", "_", s)
              return s[:80]

          def font(size, bold=False):
              paths = [
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
                  if bold else
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",

                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
                  if bold else
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              ]

              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)

              return ImageFont.load_default()

          # ==========================================================
          # GEMINI
          # ==========================================================

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          MODEL = "gemini-3.5-flash-lite"

          def ask_gemini(prompt):

              last_error = None

              for attempt in range(6):
                  try:
                      print(f"GEMINI ATTEMPT {attempt + 1}/6")

                      response = client.models.generate_content(
                          model=MODEL,
                          contents=prompt
                      )

                      text = response.text.strip()

                      if text:
                          print("GEMINI OK")
                          return text

                  except Exception as e:
                      last_error = e
                      print("Gemini error:", e)

              raise RuntimeError(f"Gemini failed: {last_error}")

          # ==========================================================
          # CONTENT PACKAGE
          # ==========================================================

          def create_package():

              prompt = """
              You are the senior producer for a professional AI technology
              YouTube channel called TechMind Studio.

              Create ONE fresh, interesting AI/technology topic that can
              realistically attract YouTube viewers.

              Avoid fake news and avoid unsupported claims.

              Create a complete 4.5 to 5 minute narration.

              IMPORTANT:
              The final video visuals will contain ONLY the small
              TECHMIND STUDIO brand at bottom-left.

              Do NOT depend on text appearing on screen.

              Return ONLY valid JSON:

              {
                "topic": "...",
                "title": "... with 1 or 2 relevant emojis",
                "description": "...",
                "hashtags": ["#AI", "#Technology", "..."],
                "tags": ["AI", "artificial intelligence", "..."],
                "script": "...",
                "visual_search": [
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "..."
                ],
                "short_script": "..."
              }

              Requirements:

              - 650-800 words for the long script.
              - Strong first 10-second hook.
              - Natural spoken language.
              - No filler.
              - Explain the topic clearly.
              - Interesting progression.
              - Strong ending.
              - Short script should be around 45-60 seconds.
              - Visual search queries must describe REAL photographic subjects,
                products, people, locations, devices, data centers, AI labs,
                computers, robots, chips, etc. related to the topic.
              - Make every visual query meaningfully different.
              """

              raw = ask_gemini(prompt)
              data = clean_json(raw)

              required = [
                  "topic",
                  "title",
                  "description",
                  "hashtags",
                  "tags",
                  "script",
                  "visual_search",
                  "short_script"
              ]

              for k in required:
                  if k not in data:
                      raise RuntimeError(f"Missing package field: {k}")

              return data

          # ==========================================================
          # WIKIMEDIA REAL HD IMAGE SEARCH
          # ==========================================================

          def search_real_image(query, output):

              print("IMAGE SEARCH:", query)

              url = "https://commons.wikimedia.org/w/api.php"

              params = {
                  "action": "query",
                  "generator": "search",
                  "gsrsearch": query,
                  "gsrnamespace": 6,
                  "gsrlimit": 15,
                  "prop": "imageinfo",
                  "iiprop": "url|size",
                  "iiurlwidth": 2400,
                  "format": "json"
              }

              try:
                  r = requests.get(
                      url,
                      params=params,
                      timeout=30,
                      headers={
                          "User-Agent":
                          "TechMindStudio/1.0 YouTubeCreator"
                      }
                  )

                  r.raise_for_status()

                  data = r.json()

                  pages = data.get("query", {}).get("pages", {})

                  candidates = []

                  for page in pages.values():

                      info = page.get("imageinfo", [])

                      if not info:
                          continue

                      item = info[0]

                      image_url = item.get("thumburl") or item.get("url")

                      width = item.get("width", 0)
                      height = item.get("height", 0)

                      if not image_url:
                          continue

                      if image_url in USED_IMAGES:
                          continue

                      if width < 1200 or height < 700:
                          continue

                      if not (
                          image_url.lower().endswith(".jpg")
                          or image_url.lower().endswith(".jpeg")
                          or image_url.lower().endswith(".png")
                          or ".jpg?" in image_url.lower()
                          or ".jpeg?" in image_url.lower()
                          or ".png?" in image_url.lower()
                      ):
                          continue

                      candidates.append(
                          (image_url, width, height, page)
                      )

                  if not candidates:
                      print("No suitable image:", query)
                      return False

                  # Prefer large landscape images
                  candidates.sort(
                      key=lambda x: (
                          x[1] * x[2],
                          x[1] / max(x[2], 1)
                      ),
                      reverse=True
                  )

                  image_url, width, height, page = candidates[0]

                  img = requests.get(
                      image_url,
                      timeout=60,
                      headers={
                          "User-Agent":
                          "TechMindStudio/1.0 YouTubeCreator"
                      }
                  )

                  img.raise_for_status()

                  output.write_bytes(img.content)

                  USED_IMAGES.add(image_url)

                  IMAGE_SOURCES.append({
                      "query": query,
                      "title": page.get("title", ""),
                      "url": image_url,
                      "width": width,
                      "height": height
                  })

                  print(
                      "IMAGE OK:",
                      width,
                      "x",
                      height
                  )

                  return True

              except Exception as e:
                  print("Image search error:", e)
                  return False

          # ==========================================================
          # FALLBACK IMAGE
          # ==========================================================

          def fallback_image(output, vertical=False):

              w = SHORT_W if vertical else LONG_W
              h = SHORT_H if vertical else LONG_H

              img = Image.new("RGB", (w, h), (8, 12, 20))
              px = img.load()

              # premium abstract tech gradient
              for y in range(h):
                  for x in range(w):
                      glow = int(
                          18 *
                          math.exp(
                              -(
                                  (
                                      (x - w * 0.55) ** 2 +
                                      (y - h * 0.40) ** 2
                                  )
                                  /
                                  (2 * (w * 0.35) ** 2)
                              )
                          )
                      )

                      px[x, y] = (
                          5 + glow // 3,
                          9 + glow // 2,
                          18 + glow
                      )

              draw = ImageDraw.Draw(img)

              # subtle futuristic lines
              for i in range(12):
                  x = int(w * (i / 12))
                  draw.line(
                      [(x, 0), (int(x * 0.8), h)],
                      fill=(35, 45, 65),
                      width=max(1, w // 1200)
                  )

              img.save(
                  output,
                  quality=96,
                  optimize=True
              )

          # ==========================================================
          # COVER CROP
          # ==========================================================

          def cover_crop(image_path, width, height):

              img = Image.open(image_path).convert("RGB")

              target_ratio = width / height
              source_ratio = img.width / img.height

              if source_ratio > target_ratio:

                  # crop width
                  new_width = int(img.height * target_ratio)
                  left = (img.width - new_width) // 2

                  img = img.crop(
                      (
                          left,
                          0,
                          left + new_width,
                          img.height
                      )
                  )

              else:

                  # crop height
                  new_height = int(img.width / target_ratio)
                  top = (img.height - new_height) // 2

                  img = img.crop(
                      (
                          0,
                          top,
                          img.width,
                          top + new_height
                      )
                  )

              return img.resize(
                  (width, height),
                  Image.Resampling.LANCZOS
              )

          # ==========================================================
          # PREMIUM FULL SCREEN VISUAL
          # ONLY BRAND AT BOTTOM LEFT
          # ==========================================================

          def create_visual(
              query,
              output,
              vertical=False,
              scene_index=0
          ):

              width = SHORT_W if vertical else LONG_W
              height = SHORT_H if vertical else LONG_H

              raw_path = output.with_suffix(".raw.jpg")

              ok = search_real_image(
                  query,
                  raw_path
              )

              if ok:
                  try:
                      img = cover_crop(
                          raw_path,
                          width,
                          height
                      )
                  except Exception:
                      fallback_image(
                          raw_path,
                          vertical
                      )
                      img = cover_crop(
                          raw_path,
                          width,
                          height
                      )
              else:
                  fallback_image(
                      raw_path,
                      vertical
                  )

                  img = cover_crop(
                      raw_path,
                      width,
                      height
                  )

              # ------------------------------------------------------
              # SUBTLE CINEMATIC COLOR TREATMENT
              # NO TEXT / NO PANELS
              # ------------------------------------------------------

              # Slight contrast enhancement
              from PIL import ImageEnhance

              img = ImageEnhance.Contrast(img).enhance(1.06)
              img = ImageEnhance.Color(img).enhance(1.04)
              img = ImageEnhance.Sharpness(img).enhance(1.08)

              draw = ImageDraw.Draw(img)

              # ------------------------------------------------------
              # ONLY BRAND - BOTTOM LEFT
              # ------------------------------------------------------

              brand_size = 34 if not vertical else 32

              brand_font = font(
                  brand_size,
                  bold=True
              )

              margin_x = 42 if not vertical else 34
              margin_y = 34 if not vertical else 55

              bbox = draw.textbbox(
                  (0, 0),
                  BRAND,
                  font=brand_font
              )

              text_w = bbox[2] - bbox[0]
              text_h = bbox[3] - bbox[1]

              x = margin_x
              y = height - margin_y - text_h

              # Small translucent black backing
              pad_x = 16
              pad_y = 9

              draw.rounded_rectangle(
                  (
                      x - pad_x,
                      y - pad_y,
                      x + text_w + pad_x,
                      y + text_h + pad_y
                  ),
                  radius=12,
                  fill=(0, 0, 0, 145)
              )

              # subtle bright accent line
              draw.rounded_rectangle(
                  (
                      x - pad_x,
                      y - pad_y,
                      x - pad_x + 5,
                      y + text_h + pad_y
                  ),
                  radius=3,
                  fill=(255, 255, 255, 230)
              )

              draw.text(
                  (x, y),
                  BRAND,
                  font=brand_font,
                  fill=(255, 255, 255, 245)
              )

              img.save(
                  output,
                  "JPEG",
                  quality=97,
                  subsampling=0
              )

              try:
                  raw_path.unlink()
              except Exception:
                  pass

          # ==========================================================
          # TTS
          # ==========================================================

          async def make_tts(text, output):

              voice = "en-US-ChristopherNeural"

              communicate = edge_tts.Communicate(
                  text,
                  voice,
                  rate="-5%",
                  volume="+0%"
              )

              await communicate.save(str(output))

          def tts(text, output):

              import asyncio

              asyncio.run(
                  make_tts(text, output)
              )

          # ==========================================================
          # SCRIPT SPLITTER
          # ==========================================================

          def split_script(script, count):

              sentences = re.split(
                  r'(?<=[.!?])\s+',
                  script.strip()
              )

              sentences = [
                  s.strip()
                  for s in sentences
                  if len(s.strip()) > 20
              ]

              if not sentences:
                  return [script]

              groups = []

              per = max(
                  1,
                  math.ceil(len(sentences) / count)
              )

              for i in range(0, len(sentences), per):
                  groups.append(
                      " ".join(
                          sentences[i:i + per]
                      )
                  )

              while len(groups) < count:
                  groups.append(groups[-1])

              return groups[:count]

          # ==========================================================
          # SMOOTH CINEMATIC IMAGE ANIMATION
          # ==========================================================

          def make_scene_video(
              image,
              audio,
              output,
              vertical=False,
              index=0
          ):

              width = SHORT_W if vertical else LONG_W
              height = SHORT_H if vertical else LONG_H

              # Get audio duration
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(audio)
                  ],
                  stdout=subprocess.PIPE,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              frames = max(
                  1,
                  int(duration * FPS)
              )

              # Different motion per scene.
              # Very small movement = premium cinematic feel.
              mode = index % 6

              if mode == 0:
                  zoom = (
                      f"zoom='min(zoom+0.00055,1.10)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)'"
                  )

              elif mode == 1:
                  zoom = (
                      f"zoom='min(zoom+0.00050,1.09)':"
                      f"x='(iw-iw/zoom)*on/{max(frames-1,1)}':"
                      f"y='ih/2-(ih/zoom/2)'"
                  )

              elif mode == 2:
                  zoom = (
                      f"zoom='min(zoom+0.00050,1.09)':"
                      f"x='(iw-iw/zoom)*(1-on/{max(frames-1,1)})':"
                      f"y='ih/2-(ih/zoom/2)'"
                  )

              elif mode == 3:
                  zoom = (
                      f"zoom='min(zoom+0.00048,1.085)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='(ih-ih/zoom)*on/{max(frames-1,1)}'"
                  )

              elif mode == 4:
                  zoom = (
                      f"zoom='min(zoom+0.00048,1.085)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='(ih-ih/zoom)*(1-on/{max(frames-1,1)})'"
                  )

              else:
                  zoom = (
                      f"zoom='min(zoom+0.00042,1.08)':"
                      f"x='(iw-iw/zoom)*0.5':"
                      f"y='(ih-ih/zoom)*0.5'"
                  )

              vf = (
                  f"scale={width}:{height}:"
                  f"force_original_aspect_ratio=increase,"
                  f"crop={width}:{height},"
                  f"zoompan="
                  f"{zoom}:"
                  f"d=1:"
                  f"s={width}x{height}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-i", str(audio),
                  "-vf", vf,
                  "-t", f"{duration:.3f}",
                  "-r", str(FPS),
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "18",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-movflags", "+faststart",
                  str(output)
              ])

          # ==========================================================
          # SMOOTH TRANSITION CONCAT
          # ==========================================================

          def concat_scenes(scene_files, output):

              list_file = ROOT / (
                  "long_concat.txt"
                  if "long" in str(output)
                  else "short_concat.txt"
              )

              with open(list_file, "w") as f:
                  for item in scene_files:
                      f.write(
                          f"file '{Path(item).resolve()}'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(list_file),
                  "-c", "copy",
                  "-movflags", "+faststart",
                  str(output)
              ])

          # ==========================================================
          # BUILD LONG
          # ==========================================================

          def build_long(pkg):

              chunks = split_script(
                  pkg["script"],
                  10
              )

              videos = []

              for i, chunk in enumerate(chunks):

                  scene_num = i + 1

                  image = LONG_DIR / (
                      f"scene_{scene_num:02d}.jpg"
                  )

                  audio = AUDIO_DIR / (
                      f"long_{scene_num:02d}.mp3"
                  )

                  video = LONG_DIR / (
                      f"scene_{scene_num:02d}.mp4"
                  )

                  query = pkg["visual_search"][
                      i % len(pkg["visual_search"])
                  ]

                  print(
                      f"\nLONG SCENE {scene_num}/"
                      f"{len(chunks)}"
                  )

                  create_visual(
                      query,
                      image,
                      vertical=False,
                      scene_index=i
                  )

                  tts(
                      chunk,
                      audio
                  )

                  make_scene_video(
                      image,
                      audio,
                      video,
                      vertical=False,
                      index=i
                  )

                  videos.append(video)

              final = ROOT / "TechMind_Studio_Long.mp4"

              concat_scenes(
                  videos,
                  final
              )

              return final

          # ==========================================================
          # BUILD SHORT
          # ==========================================================

          def build_short(pkg):

              chunks = split_script(
                  pkg["short_script"],
                  5
              )

              videos = []

              for i, chunk in enumerate(chunks):

                  scene_num = i + 1

                  image = SHORT_DIR / (
                      f"scene_{scene_num:02d}.jpg"
                  )

                  audio = AUDIO_DIR / (
                      f"short_{scene_num:02d}.mp3"
                  )

                  video = SHORT_DIR / (
                      f"scene_{scene_num:02d}.mp4"
                  )

                  query = pkg["visual_search"][
                      (i + 3) %
                      len(pkg["visual_search"])
                  ]

                  print(
                      f"\nSHORT SCENE {scene_num}/"
                      f"{len(chunks)}"
                  )

                  create_visual(
                      query,
                      image,
                      vertical=True,
                      scene_index=i + 20
                  )

                  tts(
                      chunk,
                      audio
                  )

                  make_scene_video(
                      image,
                      audio,
                      video,
                      vertical=True,
                      index=i + 20
                  )

                  videos.append(video)

              final = ROOT / "TechMind_Studio_Short.mp4"

              concat_scenes(
                  videos,
                  final
              )

              return final

          # ==========================================================
          # THUMBNAIL
          # ==========================================================

          def create_thumbnail(pkg):

              out = ROOT / "thumbnail.jpg"

              img = Image.new(
                  "RGB",
                  (1280, 720),
                  (8, 12, 20)
              )

              draw = ImageDraw.Draw(img)

              title = pkg["title"]

              # thumbnail can have title;
              # this does NOT appear inside the video.
              f1 = font(62, True)
              f2 = font(34, True)

              words = title.split()
              lines = []
              line = ""

              for word in words:
                  test = (
                      line + " " + word
                  ).strip()

                  if draw.textbbox(
                      (0, 0),
                      test,
                      font=f1
                  )[2] < 1080:
                      line = test
                  else:
                      if line:
                          lines.append(line)
                      line = word

              if line:
                  lines.append(line)

              y = 230

              for line in lines[:4]:

                  draw.text(
                      (70, y),
                      line,
                      font=f1,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 80

              draw.text(
                  (70, 80),
                  BRAND,
                  font=f2,
                  fill="white"
              )

              img.save(
                  out,
                  "JPEG",
                  quality=97
              )

              return out

          # ==========================================================
          # YOUTUBE UPLOAD
          # ==========================================================

          def youtube_service():

              from google.oauth2.credentials import Credentials
              from googleapiclient.discovery import build

              token = os.environ["YOUTUBE_TOKEN_JSON"]

              creds = Credentials.from_authorized_user_info(
                  json.loads(token),
                  scopes=[
                      "https://www.googleapis.com/auth/youtube.upload"
                  ]
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=creds
              )

          def upload_video(
              service,
              video_path,
              title,
              description,
              tags,
              is_short=False
          ):

              from googleapiclient.http import MediaFileUpload

              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": tags,
                      "categoryId": "28",
                      "defaultLanguage": "en"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              if is_short:
                  body["snippet"]["description"] += (
                      "\n\n#Shorts"
                  )

              media = MediaFileUpload(
                  str(video_path),
                  chunksize=-1,
                  resumable=True
              )

              request = service.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = request.execute()

              print(
                  "YOUTUBE UPLOADED:",
                  response.get("id")
              )

              return response.get("id")

          # ==========================================================
          # MAIN
          # ==========================================================

          def main():

              print("=" * 70)
              print("TECHMIND STUDIO PRODUCTION ENGINE")
              print("=" * 70)

              pkg = create_package()

              print("\nTOPIC:", pkg["topic"])
              print("TITLE:", pkg["title"])

              long_video = build_long(pkg)
              short_video = build_short(pkg)
              thumbnail = create_thumbnail(pkg)

              # ------------------------------------------------------
              # QUALITY CHECKS
              # ------------------------------------------------------

              for video in [
                  long_video,
                  short_video
              ]:

                  if not video.exists():
                      raise RuntimeError(
                          f"Missing video: {video}"
                      )

                  if video.stat().st_size < 1_000_000:
                      raise RuntimeError(
                          f"Video suspiciously small: {video}"
                      )

              # Long duration check
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(long_video)
                  ],
                  stdout=subprocess.PIPE,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              print(
                  f"LONG VIDEO DURATION: {duration:.2f}s"
              )

              if duration < 240:
                  raise RuntimeError(
                      "Long video is below 4 minutes."
                  )

              # ------------------------------------------------------
              # METADATA
              # ------------------------------------------------------

              description = pkg["description"]

              description += "\n\n"

              description += " ".join(
                  pkg["hashtags"]
              )

              description += (
                  "\n\nProduced by TechMind Studio."
              )

              if IMAGE_SOURCES:
                  description += (
                      "\n\nVisual sources:"
                  )

                  for item in IMAGE_SOURCES:
                      description += (
                          f"\n- {item['title']}: "
                          f"{item['url']}"
                      )

              service = youtube_service()

              # ------------------------------------------------------
              # LONG UPLOAD
              # ------------------------------------------------------

              long_id = upload_video(
                  service,
                  long_video,
                  pkg["title"],
                  description,
                  pkg["tags"],
                  is_short=False
              )

              # ------------------------------------------------------
              # SHORT UPLOAD
              # ------------------------------------------------------

              short_title = (
                  pkg["title"]
                  if "#Shorts" in pkg["title"]
                  else pkg["title"] + " #Shorts"
              )

              short_id = upload_video(
                  service,
                  short_video,
                  short_title,
                  description,
                  pkg["tags"],
                  is_short=True
              )

              # ------------------------------------------------------
              # SAVE PACKAGE
              # ------------------------------------------------------

              package_out = ROOT / "package.json"

              package_out.write_text(
                  json.dumps(
                      {
                          **pkg,
                          "long_video_id": long_id,
                          "short_video_id": short_id,
                          "image_sources": IMAGE_SOURCES
                      },
                      indent=2,
                      ensure_ascii=False
                  )
              )

              print("\n" + "=" * 70)
              print("PRODUCTION COMPLETE")
              print("=" * 70)
              print("LONG ID :", long_id)
              print("SHORT ID:", short_id)
              print("DURATION:", duration)
              print("=" * 70)


          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # 3. RUN CREATOR
      # ============================================================
      - name: Generate and upload
        run: |
          python creator.py

      # ============================================================
      # 4. SAVE OUTPUTS
      # ============================================================
      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-production
          path: production/
          retention-days: 7
