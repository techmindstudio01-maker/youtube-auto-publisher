name: TechMind AI Creator - Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Create and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |

          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import base64
          import subprocess
          import requests
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          TOKEN_JSON = os.environ["YOUTUBE_TOKEN_JSON"]

          # Current text models, with fallback.
          TEXT_MODELS = [
              "gemini-3.8-flash",
              "gemini-3.5-flash-lite",
              "gemini-2.5-flash"
          ]

          # Current Gemini image-generation model.
          IMAGE_MODEL = "gemini-nano-banana-2.1"

          ROOT = Path("production")
          LONG_DIR = ROOT / "long"
          SHORT_DIR = ROOT / "short"

          LONG_DIR.mkdir(parents=True, exist_ok=True)
          SHORT_DIR.mkdir(parents=True, exist_ok=True)

          def run(cmd):
              print("RUN:", " ".join(map(str, cmd)))
              p = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )
              print(p.stdout[-5000:])
              if p.returncode != 0:
                  raise RuntimeError(
                      "Command failed: " + " ".join(map(str, cmd))
                  )
              return p.stdout

          def duration(path):
              out = run([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ])
              return float(out.strip())

          def clean(s):
              return re.sub(r"\s+", " ", str(s or "")).strip()

          # ==========================================================
          # GEMINI TEXT WITH FALLBACKS
          # ==========================================================

          def gemini_text(prompt):

              last_error = None

              for model in TEXT_MODELS:

                  for attempt in range(6):

                      print(
                          f"TEXT MODEL={model} "
                          f"ATTEMPT={attempt+1}/6"
                      )

                      url = (
                          "https://generativelanguage.googleapis.com/"
                          "v1beta/models/"
                          + model +
                          ":generateContent"
                      )

                      payload = {
                          "contents": [{
                              "parts": [{
                                  "text": prompt
                              }]
                          }],
                          "generationConfig": {
                              "temperature": 0.75,
                              "responseMimeType": "application/json"
                          }
                      }

                      try:

                          r = requests.post(
                              url,
                              headers={
                                  "x-goog-api-key": GEMINI_KEY,
                                  "Content-Type": "application/json"
                              },
                              json=payload,
                              timeout=120
                          )

                          print("STATUS:", r.status_code)

                          if r.status_code in [429, 500, 502, 503, 504]:
                              wait = min(60, 8 * (attempt + 1))
                              print(
                                  f"Temporary Gemini error. "
                                  f"Waiting {wait}s..."
                              )
                              time.sleep(wait)
                              continue

                          if r.status_code in [400, 401, 403, 404]:
                              print(
                                  "Model/API rejected request:",
                                  r.text[:1000]
                              )
                              break

                          r.raise_for_status()

                          data = r.json()

                          text = (
                              data["candidates"][0]
                              ["content"]["parts"][0]["text"]
                          ).strip()

                          text = re.sub(
                              r"^```json\s*",
                              "",
                              text,
                              flags=re.I
                          )
                          text = re.sub(
                              r"^```\s*",
                              "",
                              text
                          )
                          text = re.sub(
                              r"\s*```$",
                              "",
                              text
                          ).strip()

                          return json.loads(text)

                      except Exception as e:
                          last_error = e
                          print("ERROR:", repr(e))
                          time.sleep(
                              min(60, 8 * (attempt + 1))
                          )

                  print(
                      f"Model {model} exhausted. "
                      f"Trying next model."
                  )

              raise RuntimeError(
                  "All Gemini text models failed: "
                  + repr(last_error)
              )

          # ==========================================================
          # FRESH AI TOPICS
          # ==========================================================

          def get_news():

              feeds = [
                  "https://news.google.com/rss/search?"
                  "q=AI+artificial+intelligence+when:1d"
                  "&hl=en-US&gl=US&ceid=US:en",

                  "https://news.google.com/rss/search?"
                  "q=generative+AI+technology+when:1d"
                  "&hl=en-US&gl=US&ceid=US:en",

                  "https://news.google.com/rss/search?"
                  "q=AI+tools+technology+when:1d"
                  "&hl=en-US&gl=US&ceid=US:en"
              ]

              results = []

              for url in feeds:
                  try:
                      r = requests.get(
                          url,
                          timeout=30,
                          headers={
                              "User-Agent":
                              "Mozilla/5.0"
                          }
                      )
                      r.raise_for_status()

                      root = ET.fromstring(r.text)

                      for item in root.findall(".//item")[:12]:
                          title = clean(
                              item.findtext("title") or ""
                          )
                          link = (
                              item.findtext("link") or ""
                          )
                          desc = clean(
                              item.findtext(
                                  "description"
                              ) or ""
                          )

                          if title:
                              results.append({
                                  "title": title,
                                  "description": desc[:700],
                                  "link": link
                              })

                  except Exception as e:
                      print("NEWS ERROR:", repr(e))

              seen = set()
              unique = []

              for x in results:
                  key = x["title"].lower()
                  if key not in seen:
                      seen.add(key)
                      unique.append(x)

              return unique[:30]

          news = get_news()

          if not news:
              raise RuntimeError(
                  "No fresh AI news available."
              )

          prompt = f"""
          You are a professional YouTube technology producer.

          Channel: TechMind.

          Select ONE strong current AI/technology topic from this
          fresh news list:

          {json.dumps(news, ensure_ascii=False)}

          Create a complete production package.

          REQUIREMENTS:

          LONG VIDEO:
          - 4 to 5 minutes.
          - 650-750 spoken words.
          - 7 distinct scenes.
          - Strong curiosity hook immediately.
          - Natural conversational English.
          - Explain what happened.
          - Explain why it matters.
          - Explain how it works.
          - Give concrete examples.
          - Explain practical impact.
          - End with a useful conclusion.
          - No filler.
          - No invented facts.

          Every scene must have:
          scene_number
          scene_title
          narration
          visual_prompt

          VISUAL PROMPTS:
          Every scene must be visually different.
          Use cinematic editorial AI/technology imagery.
          Do not make generic office stock photos.
          No watermarks.
          No random logos.
          No important text inside generated images.

          SHORT:
          - 35-55 seconds.
          - 4 scenes.
          - Fast strong hook.
          - Vertical 9:16 visuals.

          TITLE:
          - Clickable but truthful.
          - Under 90 characters.
          - One relevant emoji.

          DESCRIPTION:
          - Professional.
          - Useful.
          - Include hashtags.

          TAGS:
          - 12-15 relevant YouTube tags.

          Return ONLY valid JSON:

          {{
            "topic": "...",
            "source_url": "...",
            "title": "...",
            "description": "...",
            "hashtags": ["#AI","#Technology"],
            "tags": ["AI","artificial intelligence"],
            "long_scenes": [
              {{
                "scene_number": 1,
                "scene_title": "...",
                "narration": "...",
                "visual_prompt": "..."
              }}
            ],
            "short_scenes": [
              {{
                "scene_number": 1,
                "scene_title": "...",
                "narration": "...",
                "visual_prompt": "..."
              }}
            ]
          }}
          """

          package = gemini_text(prompt)

          if len(package.get("long_scenes", [])) < 6:
              raise RuntimeError(
                  "AI returned too few long scenes."
              )

          if len(package.get("short_scenes", [])) < 4:
              raise RuntimeError(
                  "AI returned too few short scenes."
              )

          print("TOPIC:", package["topic"])
          print("TITLE:", package["title"])

          # ==========================================================
          # GEMINI IMAGE GENERATION
          # ==========================================================

          def generate_image(prompt, output, ratio):

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/interactions"
              )

              payload = {
                  "model": IMAGE_MODEL,
                  "input": prompt,
                  "response_format": {
                      "type": "image",
                      "mime_type": "image/jpeg",
                      "aspect_ratio": ratio,
                      "image_size": "1K"
                  }
              }

              for attempt in range(6):

                  print(
                      "IMAGE",
                      output,
                      "ATTEMPT",
                      attempt + 1
                  )

                  try:

                      r = requests.post(
                          url,
                          headers={
                              "x-goog-api-key": GEMINI_KEY,
                              "Content-Type": "application/json"
                          },
                          json=payload,
                          timeout=240
                      )

                      print(
                          "IMAGE STATUS:",
                          r.status_code
                      )

                      if r.status_code in [
                          429, 500, 502, 503, 504
                      ]:
                          time.sleep(
                              min(60, 10 * (attempt + 1))
                          )
                          continue

                      r.raise_for_status()

                      data = r.json()
                      image_data = None

                      if data.get("output_image"):
                          image_data = data[
                              "output_image"
                          ].get("data")

                      if not image_data:
                          for step in data.get(
                              "steps", []
                          ):
                              if step.get(
                                  "type"
                              ) == "model_output":

                                  for block in step.get(
                                      "content", []
                                  ):
                                      if block.get(
                                          "type"
                                      ) == "image":
                                          image_data = block.get(
                                              "data"
                                          )

                      if not image_data:
                          raise RuntimeError(
                              "No image returned."
                          )

                      with open(
                          output,
                          "wb"
                      ) as f:
                          f.write(
                              base64.b64decode(
                                  image_data
                              )
                          )

                      return

                  except Exception as e:
                      print(
                          "IMAGE ERROR:",
                          repr(e)
                      )
                      time.sleep(
                          min(60, 10 * (attempt + 1))
                      )

              raise RuntimeError(
                  "Image generation failed: "
                  + str(output)
              )

          # ==========================================================
          # GENERATE LONG VISUALS
          # ==========================================================

          for scene in package["long_scenes"]:

              n = int(scene["scene_number"])

              visual_prompt = f"""
              Premium cinematic editorial image for an AI
              technology YouTube documentary.

              Story:
              {scene["narration"]}

              Visual direction:
              {scene["visual_prompt"]}

              Requirements:
              photorealistic,
              cinematic lighting,
              strong composition,
              modern technology journalism,
              high detail,
              visually dramatic,
              16:9 landscape.

              Avoid:
              generic office stock photos,
              watermarks,
              random logos,
              distorted faces,
              meaningless text.

              Do not place important text in the image.
              """

              generate_image(
                  visual_prompt,
                  LONG_DIR / f"scene_{n:02d}.jpg",
                  "16:9"
              )

          # ==========================================================
          # GENERATE SHORT VISUALS
          # ==========================================================

          for scene in package["short_scenes"]:

              n = int(scene["scene_number"])

              visual_prompt = f"""
              Premium cinematic vertical visual for a
              high-retention AI technology YouTube Short.

              Story:
              {scene["narration"]}

              Visual direction:
              {scene["visual_prompt"]}

              Requirements:
              photorealistic,
              cinematic,
              high contrast,
              modern technology journalism,
              visually dramatic,
              9:16 vertical.

              Avoid generic stock photos, watermarks,
              random logos and meaningless text.
              """

              generate_image(
                  visual_prompt,
                  SHORT_DIR / f"scene_{n:02d}.jpg",
                  "9:16"
              )

          # ==========================================================
          # TTS
          # ==========================================================

          def tts(text, output):

              run([
                  "edge-tts",
                  "--voice",
                  "en-US-GuyNeural",
                  "--rate=-5%",
                  "--text",
                  clean(text),
                  "--write-media",
                  str(output)
              ])

          # ==========================================================
          # LONG SCENE VIDEO
          # ==========================================================

          long_files = []
          long_durations = []

          for scene in package["long_scenes"]:

              n = int(scene["scene_number"])

              image = LONG_DIR / f"scene_{n:02d}.jpg"
              audio = LONG_DIR / f"scene_{n:02d}.mp3"
              video = LONG_DIR / f"scene_{n:02d}.mp4"

              tts(
                  scene["narration"],
                  audio
              )

              d = duration(audio)

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-i", str(audio),
                  "-t", str(d),
                  "-vf",
                  (
                      "scale=2200:-2,"
                      "crop=1920:1080,"
                      "zoompan="
                      "z='min(zoom+0.0003,1.08)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:s=1920x1080:fps=30,"
                      "format=yuv420p"
                  ),
                  "-af",
                  "loudnorm=I=-14:TP=-1.5:LRA=11",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "21",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  str(video)
              ])

              long_files.append(video)
              long_durations.append(d)

          # ==========================================================
          # CONCAT LONG
          # ==========================================================

          concat = ROOT / "long.txt"

          with open(concat, "w") as f:
              for x in long_files:
                  f.write(
                      f"file '{x.resolve()}'\n"
                  )

          long_raw = ROOT / "long_raw.mp4"

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat),
              "-c", "copy",
              str(long_raw)
          ])

          # ==========================================================
          # LONG CAPTIONS
          # ==========================================================

          def srt_time(sec):

              ms = int(sec * 1000)

              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000

              return (
                  f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"
              )

          srt = ROOT / "long.srt"

          current = 0
          idx = 1

          with open(
              srt,
              "w",
              encoding="utf-8"
          ) as f:

              for scene, d in zip(
                  package["long_scenes"],
                  long_durations
              ):

                  words = clean(
                      scene["narration"]
                  ).split()

                  chunks = [
                      words[i:i+9]
                      for i in range(
                          0,
                          len(words),
                          9
                      )
                  ]

                  for i, chunk in enumerate(chunks):

                      start = current + (
                          d * i / len(chunks)
                      )

                      end = current + (
                          d * (i+1) / len(chunks)
                      )

                      f.write(
                          f"{idx}\n"
                          f"{srt_time(start)} --> "
                          f"{srt_time(end)}\n"
                          f"{' '.join(chunk)}\n\n"
                      )

                      idx += 1

                  current += d

          # ==========================================================
          # FINAL LONG VIDEO
          # ==========================================================

          long_final = ROOT / "TechMind_Long.mp4"

          run([
              "ffmpeg", "-y",
              "-i", str(long_raw),
              "-vf",
              (
                  "subtitles="
                  + str(srt)
                  + ":force_style="
                  "'FontName=DejaVu Sans,"
                  "FontSize=20,"
                  "Bold=1,"
                  "Outline=2,"
                  "Shadow=1,"
                  "MarginV=55'"
              ),
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "20",
              "-c:a", "aac",
              "-b:a", "192k",
              str(long_final)
          ])

          # ==========================================================
          # SHORT
          # ==========================================================

          short_files = []
          short_durations = []

          for scene in package["short_scenes"]:

              n = int(scene["scene_number"])

              image = SHORT_DIR / f"scene_{n:02d}.jpg"
              audio = SHORT_DIR / f"scene_{n:02d}.mp3"
              video = SHORT_DIR / f"scene_{n:02d}.mp4"

              tts(
                  scene["narration"],
                  audio
              )

              d = duration(audio)

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-i", str(audio),
                  "-t", str(d),
                  "-vf",
                  (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio=increase,"
                      "crop=1080:1920,"
                      "zoompan="
                      "z='min(zoom+0.0004,1.07)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:s=1080x1920:fps=30,"
                      "format=yuv420p"
                  ),
                  "-af",
                  "loudnorm=I=-14:TP=-1.5:LRA=11",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",
                  "-c:a", "aac",
                  "-b:a", "160k",
                  "-shortest",
                  str(video)
              ])

              short_files.append(video)
              short_durations.append(d)

          short_concat = ROOT / "short.txt"

          with open(short_concat, "w") as f:
              for x in short_files:
                  f.write(
                      f"file '{x.resolve()}'\n"
                  )

          short_raw = ROOT / "short_raw.mp4"

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(short_concat),
              "-c", "copy",
              str(short_raw)
          ])

          # ==========================================================
          # SHORT FINAL
          # ==========================================================

          short_final = ROOT / "TechMind_Short.mp4"

          run([
              "ffmpeg", "-y",
              "-i", str(short_raw),
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "21",
              "-c:a", "aac",
              "-b:a", "160k",
              str(short_final)
          ])

          # ==========================================================
          # THUMBNAIL
          # ==========================================================

          thumb_bg = ROOT / "thumbnail_bg.jpg"

          generate_image(
              f"""
              Professional YouTube thumbnail for:
              {package['title']}

              16:9.
              Extremely eye-catching.
              Premium AI technology visual.
              Strong subject on right.
              Clean dark space on left.
              Cinematic lighting.
              High contrast.
              Realistic.
              No text.
              No watermark.
              No random logo.
              """,
              thumb_bg,
              "16:9"
          )

          img = Image.open(
              thumb_bg
          ).convert("RGB").resize((1280,720))

          draw = ImageDraw.Draw(img)

          font_path = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          font = ImageFont.truetype(
              font_path,
              58
          )

          title = re.sub(
              r"[^\x00-\x7F]+",
              "",
              package["title"]
          )

          words = title.split()

          if len(words) > 7:
              title = " ".join(words[:7])

          lines = []
          current_line = ""

          for word in title.split():

              test = (
                  current_line + " " + word
              ).strip()

              if len(test) > 19:
                  lines.append(current_line)
                  current_line = word
              else:
                  current_line = test

          if current_line:
              lines.append(current_line)

          y = 180

          for line in lines[:3]:

              draw.text(
                  (55,y),
                  line,
                  font=font,
                  fill="white",
                  stroke_width=5,
                  stroke_fill="black"
              )

              y += 75

          draw.text(
              (58,635),
              "TECHMIND",
              font=ImageFont.truetype(
                  font_path,
                  27
              ),
              fill="white",
              stroke_width=2,
              stroke_fill="black"
          )

          thumbnail = ROOT / "thumbnail.jpg"

          img.save(
              thumbnail,
              quality=95
          )

          # ==========================================================
          # QUALITY CHECK
          # ==========================================================

          long_duration = duration(
              long_final
          )

          short_duration = duration(
              short_final
          )

          print(
              "LONG:",
              long_duration,
              "seconds"
          )

          print(
              "SHORT:",
              short_duration,
              "seconds"
          )

          if not 210 <= long_duration <= 360:
              raise RuntimeError(
                  "Long video is outside 3.5-6 minute safety range."
              )

          if short_duration < 25:
              raise RuntimeError(
                  "Short is too short."
              )

          # ==========================================================
          # METADATA
          # ==========================================================

          description = (
              clean(package["description"])
              + "\n\n"
              + " ".join(
                  package.get(
                      "hashtags",
                      []
                  )
              )
          )

          metadata = {
              "title": package["title"],
              "description": description,
              "tags": package["tags"],
              "topic": package["topic"]
          }

          (ROOT / "metadata.json").write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ==========================================================
          # YOUTUBE
          # ==========================================================

          scopes = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]

          credentials = (
              Credentials.from_authorized_user_info(
                  json.loads(TOKEN_JSON),
                  scopes
              )
          )

          if (
              credentials.expired
              and credentials.refresh_token
          ):
              credentials.refresh(
                  Request()
              )

          if not credentials.valid:
              raise RuntimeError(
                  "YouTube token is invalid."
              )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          # ==========================================================
          # LONG UPLOAD
          # ==========================================================

          body = {
              "snippet": {
                  "title": metadata["title"],
                  "description": metadata["description"],
                  "tags": metadata["tags"],
                  "categoryId": "28"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          print("UPLOADING LONG VIDEO...")

          req = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload(
                  str(long_final),
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = None

          while response is None:

              status, response = (
                  req.next_chunk()
              )

              if status:
                  print(
                      "LONG UPLOAD:",
                      int(
                          status.progress() * 100
                      ),
                      "%"
                  )

          long_id = response["id"]

          print(
              "LONG VIDEO:",
              long_id
          )

          youtube.thumbnails().set(
              videoId=long_id,
              media_body=MediaFileUpload(
                  str(thumbnail),
                  mimetype="image/jpeg"
              )
          ).execute()

          print("LONG THUMBNAIL SET")

          # ==========================================================
          # SHORT UPLOAD
          # ==========================================================

          short_title = metadata["title"]

          if len(short_title) > 75:
              short_title = short_title[:72] + "..."

          if "#Shorts" not in short_title:
              short_title += " #Shorts"

          short_body = {
              "snippet": {
                  "title": short_title,
                  "description": (
                      "Quick AI update from TechMind.\n\n"
                      + " ".join(
                          package.get(
                              "hashtags",
                              []
                          )
                      )
                  ),
                  "tags": metadata["tags"],
                  "categoryId": "28"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          print("UPLOADING SHORT...")

          req = youtube.videos().insert(
              part="snippet,status",
              body=short_body,
              media_body=MediaFileUpload(
                  str(short_final),
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = None

          while response is None:

              status, response = (
                  req.next_chunk()
              )

              if status:
                  print(
                      "SHORT UPLOAD:",
                      int(
                          status.progress() * 100
                      ),
                      "%"
                  )

          short_id = response["id"]

          print(
              "SHORT:",
              short_id
          )

          # ==========================================================
          # FINAL
          # ==========================================================

          print("")
          print("================================")
          print("PRODUCTION COMPLETE")
          print("================================")
          print(
              "LONG:",
              "https://youtube.com/watch?v="
              + long_id
          )
          print(
              "SHORT:",
              "https://youtube.com/shorts/"
              + short_id
          )
          print("================================")

          PY

          python creator.py

      - name: Save production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techmind-production
          path: production/
          retention-days: 7
