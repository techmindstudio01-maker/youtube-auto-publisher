name: AI Auto Publisher

on:
  workflow_dispatch:

  schedule:
    # Every day at 6:00 PM India time (12:30 UTC)
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Install FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 4. Install Python packages
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            edge-tts \
            Pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ==========================================
      # 5. Generate AI Content
      # ==========================================
      - name: Generate AI Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator.py

      # ==========================================
      # 6. Verify Content Package
      # ==========================================
      - name: Verify Content Package
        run: |
          python - <<'PY'
          import json
          import os

          if not os.path.exists("content_package.json"):
              raise SystemExit(
                  "ERROR: content_package.json was not created."
              )

          with open(
              "content_package.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("==========================================")
          print("Content package verified.")
          print("Title:", data.get("title"))
          print("Script words:", data.get("script_word_count"))
          print("Scenes:", len(data.get("scenes", [])))
          print("Hashtags:", data.get("hashtags"))
          print("Tags:", data.get("tags"))
          print("==========================================")
          PY

      # ==========================================
      # 7. Render Long-form Video
      # ==========================================
      - name: Render Long Video
        run: |
          python video_renderer.py

      # ==========================================
      # 8. Verify Long-form Video
      # ==========================================
      - name: Verify Long Video
        run: |
          if [ ! -f "techmind_studio_long.mp4" ]; then
            echo "ERROR: Long video was not created."
            exit 1
          fi

          echo "Long video created successfully."

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            techmind_studio_long.mp4

      # ==========================================
      # 9. Generate Professional Thumbnail
      # ==========================================
      - name: Generate Thumbnail
        run: |
          python thumbnail_generator.py

      # ==========================================
      # 10. Verify Thumbnail
      # ==========================================
      - name: Verify Thumbnail
        run: |
          if [ ! -f "techmind_studio_thumbnail.png" ]; then
            echo "ERROR: Thumbnail was not created."
            exit 1
          fi

          echo "Thumbnail created successfully."

          python - <<'PY'
          from PIL import Image

          image = Image.open("techmind_studio_thumbnail.png")

          print("==========================================")
          print("Thumbnail verified.")
          print("Format:", image.format)
          print("Size:", image.size)
          print("==========================================")

          if image.size != (1280, 720):
              raise SystemExit(
                  "ERROR: Thumbnail must be 1280x720."
              )
          PY

      # ==========================================
      # 11. Save Content Package
      # ==========================================
      - name: Save Content Package
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-package
          path: content_package.json
          retention-days: 7

      # ==========================================
      # 12. Save Long Video
      # ==========================================
      - name: Save Long Video
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-long-video
          path: techmind_studio_long.mp4
          retention-days: 7

      # ==========================================
      # 13. Save Thumbnail
      # ==========================================
      - name: Save Thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-thumbnail
          path: techmind_studio_thumbnail.png
          retention-days: 7

      # ==========================================
      # 14. Save Automation State
      # ==========================================
      - name: Save Automation State
        run: |
          git config user.name "TechMind Studio Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state.json

          if git diff --cached --quiet; then
            echo "No automation state changes to commit."
          else
            git commit -m "Update automation state"
            git push
          fi
