name: TechMind AI Creator - Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth edge-tts feedparser pillow requests

      - name: Create creator.py
        run: |
          cat > creator.py <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          import feedparser
          from PIL import Image, ImageDraw, ImageFont

          from google import genai
          from google.genai import types

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials


          # ============================================================
          # DIRECTORIES
          # ============================================================

          ROOT = Path("production")
          VISUAL_DIR = ROOT / "visuals"
          AUDIO_DIR = ROOT / "audio"
          LONG_SCENE_DIR = ROOT / "long_scenes"
          SHORT_DIR = ROOT / "short"
          THUMB_DIR = ROOT / "thumbnail"

          for d in [
              ROOT,
              VISUAL_DIR,
              AUDIO_DIR,
              LONG_SCENE_DIR,
              SHORT_DIR,
              THUMB_DIR
          ]:
              d.mkdir(parents=True, exist_ok=True)


          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          # Current reliable text models.
          TEXT_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.8-flash"
          ]

          VOICE = "en-US-GuyNeural"


          # ============================================================
          # COMMAND
          # ============================================================

          def run(cmd, check=True):

              print("\nRUN:", " ".join(map(str, cmd)))

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(result.stdout[-5000:])

              if check and result.returncode != 0:
                  raise RuntimeError(
                      "Command failed."
                  )

              return result


          # ============================================================
          # FRESH AI NEWS
          # ============================================================

          def get_news():

              feeds = [
                  "https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=generative+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=OpenAI+Gemini+AI&hl=en-US&gl=US&ceid=US:en",
                  "https://news.google.com/rss/search?q=AI+technology+2026&hl=en-US&gl=US&ceid=US:en"
              ]

              results = []
              seen = set()

              for url in feeds:

                  try:

                      feed = feedparser.parse(url)

                      for item in feed.entries[:10]:

                          title = getattr(
                              item,
                              "title",
                              ""
                          ).strip()

                          summary = getattr(
                              item,
                              "summary",
                              ""
                          )

                          summary = re.sub(
                              r"<[^>]+>",
                              "",
                              summary
                          ).strip()

                          if title:

                              key = title.lower()

                              if key not in seen:

                                  seen.add(key)

                                  results.append({
                                      "title": title,
                                      "summary": summary[:800]
                                  })

                  except Exception as e:

                      print(
                          "News feed warning:",
                          e
                      )

              return results[:30]


          # ============================================================
          # GEMINI TEXT
          # ============================================================

          def gemini_text(prompt):

              client = genai.Client(
                  api_key=GEMINI_API_KEY
              )

              last_error = None

              for model in TEXT_MODELS:

                  # Only 3 attempts.
                  # No 1-hour retry loop.
                  for attempt in range(1, 4):

                      print(
                          f"TEXT MODEL={model} "
                          f"ATTEMPT={attempt}/3"
                      )

                      try:

                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  temperature=0.8,
                                  max_output_tokens=14000
                              )
                          )

                          text = response.text

                          if text and len(
                              text.strip()
                          ) > 100:

                              print(
                                  "TEXT SUCCESS:",
                                  model
                              )

                              return text

                          raise RuntimeError(
                              "Empty Gemini response."
                          )

                      except Exception as e:

                          last_error = e

                          print(
                              "TEXT ERROR:",
                              type(e).__name__,
                              str(e)[:500]
                          )

                          error = str(e).lower()

                          retryable = any(
                              x in error
                              for x in [
                                  "429",
                                  "500",
                                  "502",
                                  "503",
                                  "504",
                                  "timeout",
                                  "timed out",
                                  "unavailable"
                              ]
                          )

                          if retryable:

                              wait = 5 * attempt

                              print(
                                  f"Waiting {wait}s..."
                              )

                              time.sleep(wait)

                          else:

                              break

                  print(
                      "Trying next text model..."
                  )

              raise RuntimeError(
                  f"Gemini text failed: {last_error}"
              )


          # ============================================================
          # JSON
          # ============================================================

          def parse_json(text):

              text = text.strip()

              text = re.sub(
                  r"^```json",
                  "",
                  text
              )

              text = re.sub(
                  r"^```",
                  "",
                  text
              )

              text = re.sub(
                  r"```$",
                  "",
                  text
              )

              text = text.strip()

              start = text.find("{")
              end = text.rfind("}")

              if start < 0 or end < 0:
                  raise RuntimeError(
                      "Gemini did not return JSON."
                  )

              return json.loads(
                  text[start:end + 1]
              )


          # ============================================================
          # AI CONTENT PACKAGE
          # ============================================================

          def create_package():

              news = get_news()

              news_text = "\n".join(
                  [
                      f"- {x['title']}: "
                      f"{x['summary']}"
                      for x in news
                  ]
              )

              prompt = f"""
          You are the senior producer of TechMind AI,
          a professional AI and technology YouTube channel.

          Current fresh topics:

          {news_text}

          Select the strongest CURRENT AI topic.

          Create an ORIGINAL YouTube video package.

          Return ONLY valid JSON.

          JSON:

          {{
            "topic": "...",
            "title": "...",
            "description": "...",
            "hashtags": ["#AI", "#Tech"],
            "tags": ["AI", "artificial intelligence"],
            "long_script": "...",
            "scenes": [
              {{
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ],
            "short_title": "...",
            "short_scenes": [
              {{
                "visual_title": "...",
                "visual_text": "...",
                "voiceover": "..."
              }}
            ]
          }}

          REQUIREMENTS:

          TITLE:
          - maximum 90 characters
          - attractive
          - NOT fake clickbait
          - include 1-2 relevant emojis

          LONG VIDEO:
          - 4 to 5 minutes
          - 10 scenes exactly
          - strong first 10 seconds
          - natural spoken English
          - original explanation
          - useful examples
          - no filler
          - clear conclusion
          - subscribe CTA at end

          Each scene must have:
          - different visual idea
          - short visual title
          - short visual text
          - natural voiceover

          SHORT:
          - 35-55 seconds
          - 5 scenes
          - very strong hook
          - vertical-video friendly

          DESCRIPTION:
          - useful 2-4 paragraphs
          - SEO keywords naturally included
          - hashtags at the end

          HASHTAGS:
          - 5-8 relevant hashtags

          TAGS:
          - 10-20 relevant YouTube tags
          """

              raw = gemini_text(prompt)

              package = parse_json(raw)

              if len(package["scenes"]) < 10:

                  raise RuntimeError(
                      "AI returned fewer than 10 scenes."
                  )

              if len(
                  package["short_scenes"]
              ) < 5:

                  raise RuntimeError(
                      "AI returned fewer than 5 short scenes."
                  )

              # Force hashtags into description.
              hashtag_text = " ".join(
                  package["hashtags"]
              )

              if hashtag_text not in package[
                  "description"
              ]:

                  package["description"] += (
                      "\n\n" + hashtag_text
                  )

              return package


          # ============================================================
          # FONTS
          # ============================================================

          FONT_BOLD = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          FONT_REGULAR = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans.ttf"
          )


          # ============================================================
          # GENERATED TECH VISUAL
          #
          # NO EXTERNAL IMAGE API.
          # Therefore no image 429 can stop the workflow.
          # ============================================================

          def create_visual(
              title,
              text,
              index,
              output,
              width=1280,
              height=720
          ):

              img = Image.new(
                  "RGB",
                  (width, height),
                  (
                      8 + (index * 7) % 25,
                      14 + (index * 11) % 35,
                      28 + (index * 17) % 55
                  )
              )

              draw = ImageDraw.Draw(img)

              bold = ImageFont.truetype(
                  FONT_BOLD,
                  54 if height == 720 else 42
              )

              regular = ImageFont.truetype(
                  FONT_REGULAR,
                  30 if height == 720 else 24
              )

              small = ImageFont.truetype(
                  FONT_BOLD,
                  24
              )

              # Tech grid.
              spacing = 80

              for x in range(
                  0,
                  width,
                  spacing
              ):

                  draw.line(
                      [(x, 0), (x, height)],
                      fill=(35, 45, 65),
                      width=1
                  )

              for y in range(
                  0,
                  height,
                  spacing
              ):

                  draw.line(
                      [(0, y), (width, y)],
                      fill=(35, 45, 65),
                      width=1
                  )

              # Decorative circles.
              for j in range(6):

                  cx = (
                      (index * 170 + j * 230)
                      % width
                  )

                  cy = (
                      120 +
                      (j * 97 + index * 43)
                      % (height - 220)
                  )

                  r = 25 + (
                      (j + index) % 4
                  ) * 12

                  draw.ellipse(
                      [
                          cx - r,
                          cy - r,
                          cx + r,
                          cy + r
                      ],
                      outline=(70, 130, 210),
                      width=3
                  )

              # Connecting lines.
              for j in range(5):

                  x1 = (
                      100 +
                      ((index * 97 + j * 190)
                       % (width - 200))
                  )

                  y1 = (
                      170 +
                      ((j * 83 + index * 31)
                       % (height - 300))
                  )

                  x2 = (
                      300 +
                      ((index * 131 + j * 211)
                       % (width - 400))
                  )

                  y2 = (
                      250 +
                      ((j * 113 + index * 47)
                       % (height - 350))
                  )

                  draw.line(
                      [(x1, y1), (x2, y2)],
                      fill=(90, 150, 230),
                      width=3
                  )

              # Dark content panel.
              panel = (
                  70,
                  80,
                  width - 70,
                  height - 90
              )

              draw.rounded_rectangle(
                  panel,
                  radius=25,
                  fill=(7, 12, 22),
                  outline=(65, 100, 150),
                  width=2
              )

              # Scene number.
              draw.text(
                  (110, 115),
                  f"SCENE {index:02d}",
                  font=small,
                  fill=(120, 180, 255)
              )

              # Title.
              title_text = str(title)

              if len(title_text) > 55:
                  title_text = (
                      title_text[:52] + "..."
                  )

              draw.text(
                  (110, 170),
                  title_text,
                  font=bold,
                  fill="white"
              )

              # Main visual text.
              words = str(text).split()

              lines = []
              line = ""

              for word in words:

                  candidate = (
                      line + " " + word
                  ).strip()

                  if len(candidate) > 38:

                      if line:
                          lines.append(line)

                      line = word

                  else:

                      line = candidate

              if line:
                  lines.append(line)

              y = 270

              for line in lines[:5]:

                  draw.text(
                      (115, y),
                      line,
                      font=regular,
                      fill=(215, 225, 240)
                  )

                  y += 48

              # Bottom branding.
              draw.text(
                  (110, height - 135),
                  "TECHMIND AI",
                  font=small,
                  fill=(120, 180, 255)
              )

              draw.text(
                  (width - 330, height - 135),
                  "AI • TECHNOLOGY • FUTURE",
                  font=small,
                  fill=(150, 160, 175)
              )

              img.save(
                  output,
                  quality=95
              )


          # ============================================================
          # VOICE
          # ============================================================

          def create_voice(text, output):

              run([
                  "edge-tts",
                  "--voice",
                  VOICE,
                  "--rate=-5%",
                  "--text",
                  text,
                  "--write-media",
                  str(output)
              ])

              if not Path(output).exists():

                  raise RuntimeError(
                      "Voice file missing."
                  )


          # ============================================================
          # DURATION
          # ============================================================

          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:"
                      "nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True
              )

              return float(
                  result.stdout.strip()
              )


          # ============================================================
          # SRT CAPTIONS
          # ============================================================

          def srt_time(sec):

              sec = max(0, float(sec))

              h = int(sec // 3600)

              m = int(
                  (sec % 3600) // 60
              )

              s = int(sec % 60)

              ms = int(
                  (sec - int(sec)) * 1000
              )

              return (
                  f"{h:02d}:{m:02d}:{s:02d},"
                  f"{ms:03d}"
              )


          def create_srt(script, total, output):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  script.strip()
              )

              sentences = [
                  x.strip()
                  for x in sentences
                  if x.strip()
              ]

              if not sentences:
                  return

              word_total = sum(
                  len(x.split())
                  for x in sentences
              )

              current = 0

              rows = []

              for i, sentence in enumerate(
                  sentences
              ):

                  words = len(
                      sentence.split()
                  )

                  part = (
                      total *
                      words /
                      max(word_total, 1)
                  )

                  start = current
                  end = min(
                      total,
                      current + part
                  )

                  rows.append(
                      f"{i+1}\n"
                      f"{srt_time(start)} --> "
                      f"{srt_time(end)}\n"
                      f"{sentence}\n"
                  )

                  current = end

              Path(output).write_text(
                  "\n".join(rows),
                  encoding="utf-8"
              )


          # ============================================================
          # SCENE VIDEO
          # ============================================================

          def make_scene(
              image,
              audio,
              output,
              index
          ):

              dur = duration(audio)

              frames = max(
                  30,
                  int(dur * 30)
              )

              # Alternating zoom direction.
              if index % 2 == 0:

                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0010,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=1280x720:fps=30"
                  )

              else:

                  zoom = (
                      "zoompan="
                      "z='if(lte(zoom,1.001),1.12,"
                      "max(1.0,zoom-0.0010))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=1280x720:fps=30"
                  )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-i",
                  str(audio),
                  "-vf",
                  zoom,
                  "-t",
                  str(dur),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "22",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  str(output)
              ])


          # ============================================================
          # CONCAT VIDEO
          # ============================================================

          def concat(files, output):

              list_file = (
                  ROOT / "concat.txt"
              )

              with open(
                  list_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for file in files:

                      f.write(
                          "file '"
                          + str(
                              Path(file).resolve()
                          )
                          + "'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(list_file),
                  "-c",
                  "copy",
                  str(output)
              ])


          # ============================================================
          # LONG VIDEO
          # ============================================================

          def build_long(package):

              scenes = package["scenes"]

              files = []

              print(
                  "\nCREATING 10 VISUAL SCENES\n"
              )

              for i, scene in enumerate(
                  scenes[:10],
                  start=1
              ):

                  print(
                      f"\n--- SCENE {i}/10 ---"
                  )

                  image = (
                      VISUAL_DIR /
                      f"visual_{i:02d}.jpg"
                  )

                  audio = (
                      AUDIO_DIR /
                      f"audio_{i:02d}.mp3"
                  )

                  video = (
                      LONG_SCENE_DIR /
                      f"scene_{i:02d}.mp4"
                  )

                  create_visual(
                      scene["visual_title"],
                      scene["visual_text"],
                      i,
                      image
                  )

                  create_voice(
                      scene["voiceover"],
                      audio
                  )

                  make_scene(
                      image,
                      audio,
                      video,
                      i
                  )

                  files.append(video)

              raw = (
                  ROOT /
                  "long_raw.mp4"
              )

              concat(
                  files,
                  raw
              )

              final = (
                  ROOT /
                  "TechMind_AI_Long.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "21",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              # Captions file.
              srt = ROOT / "captions.srt"

              create_srt(
                  package["long_script"],
                  duration(final),
                  srt
              )

              return final


          # ============================================================
          # SHORT
          # ============================================================

          def build_short(package):

              print(
                  "\nCREATING SHORT\n"
              )

              scenes = package[
                  "short_scenes"
              ][:5]

              files = []

              for i, scene in enumerate(
                  scenes,
                  start=1
              ):

                  image = (
                      SHORT_DIR /
                      f"visual_{i:02d}.jpg"
                  )

                  audio = (
                      SHORT_DIR /
                      f"audio_{i:02d}.mp3"
                  )

                  video = (
                      SHORT_DIR /
                      f"scene_{i:02d}.mp4"
                  )

                  create_visual(
                      scene["visual_title"],
                      scene["visual_text"],
                      i,
                      image,
                      720,
                      1280
                  )

                  create_voice(
                      scene["voiceover"],
                      audio
                  )

                  dur = duration(audio)

                  frames = max(
                      30,
                      int(dur * 30)
                  )

                  vf = (
                      "scale=720:1280:"
                      "force_original_aspect_ratio="
                      "decrease,"
                      "pad=720:1280:"
                      "(ow-iw)/2:(oh-ih)/2,"
                      "zoompan="
                      "z='min(zoom+0.001,1.10)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      "s=720x1280:fps=30"
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-i",
                      str(audio),
                      "-vf",
                      vf,
                      "-t",
                      str(dur),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",
                      "-pix_fmt",
                      "yuv420p",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",
                      "-shortest",
                      str(video)
                  ])

                  files.append(video)

              raw = (
                  SHORT_DIR /
                  "short_raw.mp4"
              )

              concat(
                  files,
                  raw
              )

              final = (
                  ROOT /
                  "TechMind_AI_Short.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(raw),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "22",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ])

              return final


          # ============================================================
          # THUMBNAIL
          # ============================================================

          def thumbnail(package):

              output = (
                  THUMB_DIR /
                  "thumbnail.jpg"
              )

              img = Image.new(
                  "RGB",
                  (1280, 720),
                  (8, 14, 28)
              )

              draw = ImageDraw.Draw(img)

              title_font = ImageFont.truetype(
                  FONT_BOLD,
                  72
              )

              small_font = ImageFont.truetype(
                  FONT_BOLD,
                  30
              )

              # Large tech circles.
              for i in range(12):

                  x = (
                      (i * 137 + 150)
                      % 1280
                  )

                  y = (
                      (i * 83 + 80)
                      % 720
                  )

                  r = 35 + (
                      i % 4
                  ) * 15

                  draw.ellipse(
                      [
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ],
                      outline=(70, 130, 230),
                      width=4
                  )

              # Dark overlay panel.
              draw.rounded_rectangle(
                  (70, 80, 1210, 640),
                  radius=35,
                  fill=(5, 9, 18),
                  outline=(80, 140, 230),
                  width=3
              )

              title = package["title"]

              if len(title) > 52:
                  title = (
                      title[:49] + "..."
                  )

              # Wrap title.
              words = title.split()
              lines = []
              line = ""

              for word in words:

                  candidate = (
                      line + " " + word
                  ).strip()

                  if len(candidate) > 24:

                      lines.append(line)
                      line = word

                  else:

                      line = candidate

              if line:
                  lines.append(line)

              y = 190

              for line in lines[:4]:

                  bbox = draw.textbbox(
                      (0, 0),
                      line,
                      font=title_font
                  )

                  w = bbox[2] - bbox[0]

                  draw.text(
                      ((1280-w)/2, y),
                      line,
                      font=title_font,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 90

              draw.text(
                  (100, 570),
                  "TECHMIND AI",
                  font=small_font,
                  fill=(110, 180, 255)
              )

              img.save(
                  output,
                  quality=95
              )

              return output


          # ============================================================
          # YOUTUBE
          # ============================================================

          def youtube():

              info = json.loads(
                  os.environ[
                      "YOUTUBE_TOKEN_JSON"
                  ]
              )

              credentials = (
                  Credentials.from_authorized_user_info(
                      info,
                      scopes=[
                          "https://www.googleapis.com/"
                          "auth/youtube.upload"
                      ]
                  )
              )

              return build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )


          def upload(
              api,
              path,
              title,
              description,
              tags,
              thumbnail_path=None
          ):

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": tags[:30],
                      "categoryId": "28"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  chunksize=8 * 1024 * 1024,
                  resumable=True
              )

              request = api.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None

              while response is None:

                  status, response = (
                      request.next_chunk()
                  )

                  if status:

                      print(
                          "UPLOAD:",
                          int(
                              status.progress() * 100
                          ),
                          "%"
                      )

              video_id = response["id"]

              print(
                  "UPLOAD SUCCESS:",
                  video_id
              )

              if thumbnail_path:

                  try:

                      api.thumbnails().set(
                          videoId=video_id,
                          media_body=MediaFileUpload(
                              str(thumbnail_path),
                              mimetype="image/jpeg"
                          )
                      ).execute()

                      print(
                          "THUMBNAIL SUCCESS"
                      )

                  except Exception as e:

                      print(
                          "Thumbnail warning:",
                          e
                      )

              return video_id


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "\n================================"
              )

              print(
                  "TECHMIND AI AUTOMATION START"
              )

              print(
                  "================================\n"
              )

              package = create_package()

              print(
                  "\nTOPIC:",
                  package["topic"]
              )

              print(
                  "TITLE:",
                  package["title"]
              )

              print(
                  "HASHTAGS:",
                  package["hashtags"]
              )

              print(
                  "TAGS:",
                  package["tags"]
              )

              # Save metadata.
              (
                  ROOT / "metadata.json"
              ).write_text(
                  json.dumps(
                      package,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              # Long.
              long_video = build_long(
                  package
              )

              # Short.
              short_video = build_short(
                  package
              )

              # Thumbnail.
              thumb = thumbnail(
                  package
              )

              long_duration = duration(
                  long_video
              )

              short_duration = duration(
                  short_video
              )

              print(
                  f"\nLONG DURATION: "
                  f"{long_duration:.1f}s"
              )

              print(
                  f"SHORT DURATION: "
                  f"{short_duration:.1f}s"
              )

              if long_duration < 180:

                  raise RuntimeError(
                      "Long video is below 3 minutes."
                  )

              if short_duration < 20:

                  raise RuntimeError(
                      "Short is too short."
                  )

              # Upload.
              api = youtube()

              description = package[
                  "description"
              ]

              long_id = upload(
                  api,
                  long_video,
                  package["title"],
                  description,
                  package["tags"],
                  thumb
              )

              short_description = (
                  package["description"]
                  + "\n\n"
                  + " #Shorts"
              )

              short_id = upload(
                  api,
                  short_video,
                  package["short_title"],
                  short_description,
                  package["tags"]
              )

              print(
                  "\n================================"
              )

              print(
                  "AUTOMATION COMPLETE"
              )

              print(
                  "LONG VIDEO:",
                  long_id
              )

              print(
                  "SHORT:",
                  short_id
              )

              print(
                  "================================"
              )


          if __name__ == "__main__":
              main()

          PY

      - name: Run production
        run: |
          python creator.py

      - name: Save production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techmind-ai-production
          path: production/
          if-no-files-found: warn
          retention-days: 7
