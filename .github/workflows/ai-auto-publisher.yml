```yaml
name: AI Auto Publisher

on:
  workflow_dispatch:

  schedule:
    # Daily at 6:00 PM India time (12:30 UTC)
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: techmind-studio-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            edge-tts \
            Pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          }
          test -n "$YOUTUBE_TOKEN_JSON" || {
            echo "ERROR: YOUTUBE_TOKEN_JSON secret is missing."
            exit 1
          }
          echo "Required secrets are present."

      - name: Generate AI Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python creator.py

      - name: Verify Content Package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("content_package.json")
          if not path.exists():
              raise SystemExit("ERROR: content_package.json was not created.")

          data = json.loads(path.read_text(encoding="utf-8"))

          for field in ("title", "description", "script"):
              if not str(data.get(field, "")).strip():
                  raise SystemExit(f"ERROR: Missing content field: {field}")

          if not isinstance(data.get("scenes"), list) or not data["scenes"]:
              raise SystemExit("ERROR: No long-video scenes were generated.")

          print("Content package verified.")
          print("Title:", data["title"])
          print("Topic:", data.get("topic", "Not provided"))
          print("Long scenes:", len(data["scenes"]))
          print("Short scenes:", len(data.get("short_scenes", [])))
          print("Hashtags:", " ".join(data.get("hashtags", [])))
          print("YouTube tags:", len(data.get("tags", [])))
          PY

      - name: Render Long Video
        run: python video_renderer.py

      - name: Verify Long Video
        run: |
          test -s techmind_studio_long.mp4 || {
            echo "ERROR: Long video is missing or empty."
            exit 1
          }

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            techmind_studio_long.mp4)

          echo "Long video duration: ${DURATION} seconds"

          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration < 60:
              raise SystemExit("ERROR: Video is too short to publish.")
          if duration > 600:
              raise SystemExit("ERROR: Video exceeds the 10-minute safety limit.")
          print("Video duration check passed.")
          PY

      - name: Upload Long Video to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_youtube.py

      - name: Save Content Package
        if: always() && hashFiles('content_package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-package
          path: content_package.json
          retention-days: 7

      - name: Save Long Video
        if: always() && hashFiles('techmind_studio_long.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: techmind-studio-long-video
          path: techmind_studio_long.mp4
          retention-days: 7

      - name: Save Automation State
        if: success()
        run: |
          if [ -f automation_state.json ]; then
            git config user.name "TechMind Studio Automation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation_state.json

            if git diff --cached --quiet; then
              echo "No automation state changes to commit."
            else
              git commit -m "Update automation state"
              git push
            fi
          else
            echo "No automation_state.json found; skipping state save."
          fi
```
