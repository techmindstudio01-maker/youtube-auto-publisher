name: AI Tutorial Video Test

on:
  workflow_dispatch:

jobs:
  tutorial-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip install google-api-python-client google-auth google-auth-httplib2 edge-tts

      - name: Create AI tutorial script
        run: |
          cat > script.txt <<'EOF'
          Welcome to TechMind.

          In this video, we are going to explore five powerful ways artificial intelligence can save your time and make everyday work easier.

          First, AI can help you write faster. You can use an AI assistant to create emails, summaries, ideas, outlines, and first drafts in seconds.

          Second, AI can help you learn new skills. Instead of searching through hundreds of pages, you can ask an AI assistant to explain a difficult topic step by step and give you practical examples.

          Third, AI can help with coding. You can describe what you want to build, ask for code examples, and use AI to find errors and explain complicated programming concepts.

          Fourth, AI can help create content. You can generate ideas, scripts, captions, thumbnails concepts, and video plans much faster than doing everything manually.

          Fifth, AI can automate repetitive tasks. With the right tools, AI can connect different services and perform routine work automatically.

          The most important thing is not simply using AI. The real advantage comes from learning how to give clear instructions, checking the results, and building a repeatable workflow.

          Artificial intelligence is becoming one of the most useful tools for creators, students, developers, and businesses.

          If you want more practical AI tutorials, subscribe to TechMind and stay tuned for the next video.
          EOF

      - name: Generate AI voice
        run: |
          edge-tts \
            --voice en-US-GuyNeural \
            --rate "+5%" \
            --text "$(cat script.txt)" \
            --write-media voice.mp3

      - name: Create 16 by 9 tutorial video
        run: |
          ffmpeg -y \
            -f lavfi -i "color=c=0x111827:s=1920x1080:r=30" \
            -i voice.mp3 \
            -t 270 \
            -vf "drawtext=text='5 POWERFUL AI USES':fontcolor=white:fontsize=82:x=(w-text_w)/2:y=360,drawtext=text='TechMind AI Tutorial':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=500" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            tutorial_test.mp4

      - name: Prepare YouTube credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Upload tutorial to YouTube
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials.from_authorized_user_file(
              "youtube_token.json",
              ["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "5 Powerful AI Uses You Should Know",
                      "description": "Discover five practical ways artificial intelligence can save time and improve your workflow. More AI tutorials coming soon.",
                      "tags": [
                          "AI",
                          "Artificial Intelligence",
                          "AI Tools",
                          "AI Tutorial",
                          "TechMind"
                      ],
                      "categoryId": "28"
                  },
                  "status": {
                      "privacyStatus": "private"
                  }
              },
              media_body=MediaFileUpload(
                  "tutorial_test.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = request.execute()

          print("TUTORIAL UPLOAD SUCCESS")
          print("Video ID:", response["id"])
          print("https://www.youtube.com/watch?v=" + response["id"])
          PY
