name: YouTube Upload Test

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Create test video
        run: |
          ffmpeg -y \
            -f lavfi -i color=c=black:s=1080x1920:d=5 \
            -vf "drawtext=text='GitHub Auto Upload Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            test_video.mp4

      - name: Prepare YouTube credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Upload video to YouTube
        run: |
          python - <<'PY'
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials.from_authorized_user_file(
              "youtube_token.json",
              ["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "GitHub Auto Upload Test",
                      "description": "Test upload from GitHub Actions.",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private"
                  }
              },
              media_body=MediaFileUpload(
                  "test_video.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = request.execute()

          print("UPLOAD SUCCESS")
          print("Video ID:", response["id"])
          print("https://www.youtube.com/watch?v=" + response["id"])
          PY
